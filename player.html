<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Kodik Player &amp; Watch Party</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--sheet-bg:rgba(24,24,27,0.96);--panel-bg:rgba(28,28,30,0.92);--text-main:#ffffff;--text-sub:#a1a1aa;--tile-bg:rgba(255,255,255,0.18);--accent-green:#10b981;--accent-red:#ef4444;--accent-blue:#3b82f6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;color:var(--text-main);overflow:hidden;font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;user-select:none}
.app{position:relative;display:flex;flex-direction:column;width:100%;height:100%;background:#000}
.stage{position:relative;flex:1;min-height:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
video,iframe{position:absolute;inset:0;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;background:#000;border:0;outline:none;pointer-events:auto;z-index:1}
.top-bar{position:absolute;top:0;left:0;right:0;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:linear-gradient(180deg,#000000 0%,rgba(0,0,0,0.92) 54%,rgba(0,0,0,0.6) 82%,transparent 100%);z-index:30;transition:opacity .25s ease}
.top-row{display:flex;align-items:center;justify-content:space-between;width:100%;gap:8px}
.top-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.top-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.title-btn{background:transparent;border:0;padding:0;font-size:14px;font-weight:700;color:var(--text-main);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:32px;cursor:pointer;text-align:left;font-family:inherit}
.sub-bar{display:flex;align-items:center;gap:8px;margin-top:6px;padding-left:42px}
.pill-btn{background:var(--tile-bg);border:0;color:var(--text-main);border-radius:8px;padding:6px 12px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:5px;cursor:pointer;outline:none;line-height:normal;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,0.4);transition:transform .12s ease,background .15s ease;font-family:inherit}
.pill-btn:active{transform:scale(0.92);background:rgba(255,255,255,0.38);color:#ffffff}
.pill-btn.room-active{background:rgba(16,185,129,0.32);border:1px solid rgba(16,185,129,0.6)}
.icon-btn{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;background:var(--tile-bg);border:0;color:var(--text-main);cursor:pointer;outline:none;flex-shrink:0;box-shadow:0 8px 24px rgba(0,0,0,0.4);transition:transform .12s ease,background .15s ease}
.icon-btn:active{transform:scale(0.92);background:rgba(255,255,255,0.38);color:#ffffff}
.toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--panel-bg);border:0;padding:10px 18px;border-radius:10px;font-size:12px;font-weight:600;text-align:center;max-width:86%;z-index:45;box-shadow:0 10px 25px rgba(0,0,0,0.85);display:none}
.badge{position:absolute;top:18%;left:50%;transform:translateX(-50%);background:var(--panel-bg);border:0;padding:6px 14px;border-radius:8px;font-size:12px;font-weight:700;display:none;pointer-events:none;z-index:40}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(4px);z-index:60;display:none;align-items:flex-end;justify-content:center}
.modal-bg.centered{align-items:center;padding:16px}
.modal-sheet{width:100%;max-width:440px;background:var(--sheet-bg);border-top-left-radius:18px;border-top-right-radius:18px;border:0;padding:16px;max-height:82%;display:flex;flex-direction:column;box-shadow:0 20px 40px rgba(0,0,0,0.85)}
.modal-bg.centered .modal-sheet{border-radius:18px;border:1px solid rgba(255,255,255,0.12)}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,0.12)}
.modal-title{font-size:14px;font-weight:700;color:var(--text-main)}
.modal-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;overflow-y:auto;padding:10px 0;max-height:48vh}
.ep-tile{padding:10px 4px;font-size:11px;font-weight:700;text-align:center;background:var(--tile-bg);border:0;color:var(--text-main);border-radius:8px;cursor:pointer}
.ep-tile.active{background:#ffffff;color:#121212;box-shadow:0 4px 14px rgba(255,255,255,0.3)}
.form-group{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.form-label{font-size:12px;font-weight:600;color:var(--text-sub)}
.form-input{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:10px;padding:10px 14px;color:#fff;font-size:14px;outline:none}
.form-input:focus{border-color:rgba(255,255,255,0.5)}
.action-btn{background:#ffffff;color:#121212;border:0;border-radius:10px;padding:12px;font-size:13px;font-weight:700;cursor:pointer;outline:none;margin-top:16px}
.action-btn.secondary{background:rgba(255,255,255,0.15);color:#fff;margin-top:8px}
.action-btn.danger{background:rgba(239,68,68,0.25);color:#fca5a5;border:1px solid rgba(239,68,68,0.4)}
.room-link-box{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.06);padding:8px 12px;border-radius:10px;margin-top:12px;border:1px dashed rgba(255,255,255,0.2)}
.room-link-text{flex:1;font-size:12px;color:var(--text-sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copy-btn{background:var(--tile-bg);border:0;color:#fff;border-radius:6px;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0}
.user-list{display:flex;flex-direction:column;gap:8px;max-height:220px;overflow-y:auto;margin-top:14px}
.user-item{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,0.06);padding:8px 12px;border-radius:8px;gap:8px}
.user-name{font-size:12px;font-weight:600;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-results-list{display:flex;flex-direction:column;gap:6px;max-height:270px;overflow-y:auto;margin-top:10px}
.search-result-card{display:flex;align-items:center;gap:10px;padding:8px;background:rgba(255,255,255,0.06);border-radius:10px;cursor:pointer;text-align:left}
.search-result-card:hover{background:rgba(255,255,255,0.12)}
.search-card-poster{width:40px;height:54px;object-fit:cover;border-radius:6px;background:#27272a;flex-shrink:0}
.search-card-meta{display:flex;flex-direction:column;min-width:0;flex:1}
.search-card-title{font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-card-sub{font-size:11px;color:var(--text-sub);margin-top:2px}
body.hud-off .top-bar{opacity:0;pointer-events:none}
</style>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
<div class="app" id="appRoot">
  <div class="stage" id="stage">
    <div class="toast" id="toast"></div>
    <div class="badge" id="badge"></div>

    <div class="top-bar" id="topBar">
      <div class="top-row">
        <div class="top-left">
          <button type="button" class="icon-btn" id="backBtn" aria-label="Поиск">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          </button>
          <button type="button" class="title-btn" id="titleLbl">Открыть поиск</button>
        </div>
        <div class="top-right">
          <button type="button" class="pill-btn" id="roomBtn">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span id="roomBtnLbl">Создать комнату</span>
          </button>
          <button type="button" class="icon-btn" id="fsBtn" aria-label="Полный экран">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
          </button>
        </div>
      </div>
      <div class="sub-bar" id="subBar">
        <button type="button" class="pill-btn" id="epPickerBtn"><span id="epCurLbl">1 серия</span><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
        <button type="button" class="pill-btn" id="voicePickerBtn"><span id="voiceCurLbl" style="max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Озвучка</span><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
      </div>
    </div>

    <div class="modal-bg centered" id="createRoomModal">
      <div class="modal-sheet">
        <div class="modal-hdr">
          <span class="modal-title">Создать комнату совместного просмотра</span>
          <button type="button" class="pill-btn" id="closeCreateRoomBtn" aria-label="Закрыть"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        </div>
        <div class="form-group">
          <label class="form-label" for="createNickInput">Ваше имя:</label>
          <input class="form-input" id="createNickInput" type="text" placeholder="Например: Иван" maxlength="24">
        </div>
        <button type="button" class="action-btn" id="startRoomSubmitBtn">Открыть комнату</button>
        <button type="button" class="action-btn secondary" id="switchToJoinBtn">Войти в существующую по ID</button>
      </div>
    </div>

    <div class="modal-bg centered" id="joinRoomModal">
      <div class="modal-sheet">
        <div class="modal-hdr">
          <span class="modal-title">Вход в комнату</span>
          <button type="button" class="pill-btn" id="closeJoinRoomBtn" aria-label="Закрыть"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        </div>
        <div class="form-group">
          <label class="form-label" for="joinRoomIdInput">ID комнаты:</label>
          <input class="form-input" id="joinRoomIdInput" type="text" placeholder="room-xxxxxx">
        </div>
        <div class="form-group">
          <label class="form-label" for="joinNickInput">Ваше имя:</label>
          <input class="form-input" id="joinNickInput" type="text" placeholder="Введите никнейм" maxlength="24">
        </div>
        <button type="button" class="action-btn" id="connectRoomSubmitBtn">Подключиться к просмотру</button>
      </div>
    </div>

    <div class="modal-bg centered" id="manageRoomModal">
      <div class="modal-sheet">
        <div class="modal-hdr">
          <span class="modal-title" id="manageModalTitle">Комната просмотра</span>
          <button type="button" class="pill-btn" id="closeManageRoomBtn" aria-label="Закрыть"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        </div>
        <div class="room-link-box">
          <span class="room-link-text" id="roomLinkDisplay"></span>
          <button type="button" class="copy-btn" id="copyRoomLinkBtn">Скопировать</button>
        </div>
        <div class="form-label" style="margin-top:12px">Участники онлайн:</div>
        <div class="user-list" id="roomUsersList"></div>
        <button type="button" class="action-btn danger" id="leaveRoomBtn">Выйти из комнаты</button>
      </div>
    </div>

    <div class="modal-bg centered" id="sourceModal">
      <div class="modal-sheet">
        <div class="modal-hdr">
          <span class="modal-title">Поиск релиза</span>
          <button type="button" class="pill-btn" id="closeSourceBtn" aria-label="Закрыть"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        </div>
        <div class="form-group">
          <input class="form-input" id="sourceUrlInput" type="text" placeholder="Название аниме, shiki:2472 или ссылка...">
        </div>
        <div class="search-results-list" id="searchResultsList"></div>
      </div>
    </div>

    <div class="modal-bg" id="epModal">
      <div class="modal-sheet">
        <div class="modal-hdr">
          <span class="modal-title">Выберите серию</span>
          <button type="button" class="pill-btn" id="epCloseBtn" aria-label="Закрыть"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        </div>
        <div class="modal-grid" id="epGrid"></div>
      </div>
    </div>

    <div class="modal-bg" id="voiceModal">
      <div class="modal-sheet">
        <div class="modal-hdr">
          <span class="modal-title">Выберите озвучку</span>
          <button type="button" class="pill-btn" id="voiceCloseBtn" aria-label="Закрыть"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        </div>
        <div class="modal-grid" style="grid-template-columns:1fr;max-height:45vh" id="voiceList"></div>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  var KODIK_SEARCH_URL='https://kodik-api.com/search';
  var REGISTRY_TOKENS_URL='https://raw.githubusercontent.com/YaNesyTortiK/AnimeParsers/refs/heads/main/kdk_tokns/tokens.json';
  var FALLBACK_TOKEN='56a768d08f43091901c44b54fe970049';

  var toast=document.getElementById('toast');
  var badge=document.getElementById('badge');
  var stage=document.getElementById('stage');
  var titleLbl=document.getElementById('titleLbl');
  var epCurLbl=document.getElementById('epCurLbl');
  var voiceCurLbl=document.getElementById('voiceCurLbl');
  var epPickerBtn=document.getElementById('epPickerBtn');
  var voicePickerBtn=document.getElementById('voicePickerBtn');
  var fsBtn=document.getElementById('fsBtn');
  var backBtn=document.getElementById('backBtn');
  var epModal=document.getElementById('epModal');
  var epCloseBtn=document.getElementById('epCloseBtn');
  var epGrid=document.getElementById('epGrid');
  var voiceModal=document.getElementById('voiceModal');
  var voiceCloseBtn=document.getElementById('voiceCloseBtn');
  var voiceList=document.getElementById('voiceList');

  var roomBtn=document.getElementById('roomBtn');
  var roomBtnLbl=document.getElementById('roomBtnLbl');
  var createRoomModal=document.getElementById('createRoomModal');
  var closeCreateRoomBtn=document.getElementById('closeCreateRoomBtn');
  var createNickInput=document.getElementById('createNickInput');
  var startRoomSubmitBtn=document.getElementById('startRoomSubmitBtn');
  var switchToJoinBtn=document.getElementById('switchToJoinBtn');

  var joinRoomModal=document.getElementById('joinRoomModal');
  var closeJoinRoomBtn=document.getElementById('closeJoinRoomBtn');
  var joinRoomIdInput=document.getElementById('joinRoomIdInput');
  var joinNickInput=document.getElementById('joinNickInput');
  var connectRoomSubmitBtn=document.getElementById('connectRoomSubmitBtn');

  var manageRoomModal=document.getElementById('manageRoomModal');
  var closeManageRoomBtn=document.getElementById('closeManageRoomBtn');
  var manageModalTitle=document.getElementById('manageModalTitle');
  var roomLinkDisplay=document.getElementById('roomLinkDisplay');
  var copyRoomLinkBtn=document.getElementById('copyRoomLinkBtn');
  var roomUsersList=document.getElementById('roomUsersList');
  var leaveRoomBtn=document.getElementById('leaveRoomBtn');

  var sourceModal=document.getElementById('sourceModal');
  var closeSourceBtn=document.getElementById('closeSourceBtn');
  var sourceUrlInput=document.getElementById('sourceUrlInput');
  var searchResultsList=document.getElementById('searchResultsList');

  var activeIframe=null;
  var ctxData=null;
  var vIdx=0;
  var eIdx=0;
  var currentSrc='';
  var hudTimer=null;
  var badgeTimer=null;

  var roomState={
    active:false,
    isHost:false,
    roomId:'',
    myNick:'',
    peer:null,
    conns:[],
    hostConn:null,
    users:[]
  };

  function sanitizeCleanTitle(raw){
    if(!raw)return '';
    var str=String(raw).trim();
    str=str.replace(/\[[^\]]*?(сери|эп|сезон|из|озвуч|sub|voice|дубл|закадр|anilib|anidub|shiza|softbox)[^\]]*?\]/gi,'');
    str=str.replace(/\([^)]*?(сери|эп|сезон|из|озвуч|sub|voice|дубл|закадр|тв-\d+|фильм|ova|ona)[^)]*?\)/gi,'');
    if(str.indexOf('/')!==-1){
      var parts=str.split('/');
      if(parts[0].trim().length>=2)str=parts[0].trim();
    }
    str=str.replace(/\s+(?:\d+\s+сезон|сезон\s+\d+)\s*$/i,'');
    str=str.replace(/[()[\]{}]/g,' ').replace(/\s+/g,' ').trim();
    return str||String(raw).trim();
  }

  function flash(text){
    badge.textContent=text;
    badge.style.display='block';
    if(badgeTimer)clearTimeout(badgeTimer);
    badgeTimer=setTimeout(function(){badge.style.display='none';},1200);
  }

  function wakeHud(){
    document.body.classList.remove('hud-off');
    if(hudTimer)clearTimeout(hudTimer);
    hudTimer=setTimeout(function(){
      document.body.classList.add('hud-off');
    },3500);
  }

  function decodeRegistryTok(enc){
    var raw=(enc||'').trim();
    if(!raw||raw.length<4)return '';
    var half=Math.floor(raw.length/2);
    function rev(s){return s.split('').reverse().join('');}
    function b64(s){
      var c=s.replace(/[^A-Za-z0-9+/=]/g,'');
      var p=(4-(c.length%4))%4;
      return atob(c+'===='.slice(0,p));
    }
    return b64(rev(raw.slice(half)))+b64(rev(raw.slice(0,half)));
  }

  function getCachedTokens(){
    try{
      var raw=localStorage.getItem('kodik_tokens_cache');
      if(raw){
        var d=JSON.parse(raw);
        if(d&&Array.isArray(d.tokens)&&d.tokens.length&&Date.now()-d.ts<3600000){
          return d.tokens;
        }
      }
    }catch(e){}
    return [];
  }

  function saveCachedTokens(tokens){
    try{
      localStorage.setItem('kodik_tokens_cache',JSON.stringify({tokens:tokens,ts:Date.now()}));
    }catch(e){}
  }

  function fetchActiveTokens(){
    var cached=getCachedTokens();
    if(cached.length)return Promise.resolve(cached);

    return fetch(REGISTRY_TOKENS_URL).then(function(r){
      return r.ok?r.json():null;
    }).then(function(d){
      var list=[];
      if(d){
        var raw=[].concat(d.stable||[],d.unstable||[]);
        for(var i=0;i<raw.length;i++){
          var enc=raw[i]&&(raw[i].tokn||raw[i].tok);
          if(enc){
            try{
              var dec=decodeRegistryTok(enc);
              if(dec&&list.indexOf(dec)===-1)list.push(dec);
            }catch(err){}
          }
        }
      }
      if(!list.length)list.push(FALLBACK_TOKEN);
      saveCachedTokens(list);
      return list;
    }).catch(function(){
      return [FALLBACK_TOKEN];
    });
  }

  function queryKodik(params){
    return fetchActiveTokens().then(function(tokens){
      var idx=0;
      function next(){
        if(idx>=tokens.length)return Promise.resolve(null);
        var tok=tokens[idx++];
        var u=new URL(KODIK_SEARCH_URL);
        u.searchParams.set('token',tok);
        u.searchParams.set('limit','35');
        u.searchParams.set('with_material_data','true');
        u.searchParams.set('with_episodes','true');
        for(var k in params){
          if(Object.prototype.hasOwnProperty.call(params,k)){
            u.searchParams.set(k,params[k]);
          }
        }
        return fetch(u.toString()).then(function(r){
          return r.ok?r.json():next();
        }).then(function(d){
          if(d&&!d.error&&Array.isArray(d.results))return d.results;
          return next();
        }).catch(function(){
          return next();
        });
      }
      return next();
    });
  }

  function parseSearchTarget(raw){
    var c=(raw||'').replace(/\s+/g,' ').trim();
    if(!c)return null;
    var mShiki=c.match(/^(?:shiki|shikimori|шики)\s*[:=]?\s*(\d+)$/i);
    if(mShiki)return {shikimori_id:mShiki[1]};
    var mKp=c.match(/^(?:kp|kinopoisk|кп)\s*[:=]?\s*(\d+)$/i);
    if(mKp)return {kinopoisk_id:mKp[1]};
    return {title:c};
  }

  function groupKodikResults(results){
    var map={},order=[];
    for(var i=0;i<(results||[]).length;i++){
      var ent=results[i];
      if(!ent||typeof ent!=='object')continue;
      var shiki=String(ent.shikimori_id||'').trim();
      var kp=String(ent.kinopoisk_id||'').trim();
      var tRu=String(ent.title||'').trim();
      var tOrig=String(ent.title_orig||'').trim();
      var gk=shiki?('shiki:'+shiki):(kp?('kp:'+kp):('title:'+(tOrig||tRu||ent.id||'').toLowerCase()));
      if(!map[gk]){
        map[gk]={
          groupKey:gk,
          title:sanitizeCleanTitle(tRu||tOrig||'Kodik'),
          origTitle:tOrig,
          year:ent.year||(ent.material_data&&ent.material_data.year)||null,
          poster:(ent.material_data&&(ent.material_data.poster_url||ent.material_data.anime_poster_url))||null,
          variantsCount:0,
          variants:[]
        };
        order.push(map[gk]);
      }
      map[gk].variants.push(ent);
      map[gk].variantsCount+=1;
      if(!map[gk].poster&&ent.material_data&&(ent.material_data.poster_url||ent.material_data.anime_poster_url)){
        map[gk].poster=ent.material_data.poster_url||ent.material_data.anime_poster_url;
      }
    }
    return order;
  }

  function parseGroupVariants(rawVariants){
    return rawVariants.map(function(item,idx){
      var tr=item.translation||{};
      var title=String(tr.title||'Стандартная озвучка').trim();
      var trType=String(tr.type||'').toLowerCase();
      var typeLabel=trType==='voice'?'Озвучка':(trType==='subtitles'?'Субтитры':'Перевод');

      var episodes=[];
      if(item.seasons&&typeof item.seasons==='object'){
        var sKeys=Object.keys(item.seasons).sort(function(a,b){return Number(a)-Number(b);});
        for(var i=0;i<sKeys.length;i++){
          var sKey=sKeys[i],sObj=item.seasons[sKey];
          if(sObj&&sObj.episodes&&typeof sObj.episodes==='object'){
            var eKeys=Object.keys(sObj.episodes).sort(function(a,b){return Number(a)-Number(b);});
            for(var j=0;j<eKeys.length;j++){
              var eKey=eKeys[j],val=sObj.episodes[eKey];
              var lnk=typeof val==='string'?val:(val&&val.link?val.link:'');
              if(lnk){
                episodes.push({
                  s:String(sKey),
                  e:String(eKey),
                  label:eKey+' серия',
                  link:lnk.indexOf('//')===0?('https:'+lnk):lnk
                });
              }
            }
          }
        }
      }
      if(!episodes.length&&item.link){
        var fallbackLink=item.link.indexOf('//')===0?('https:'+item.link):item.link;
        episodes.push({s:'1',e:'1',label:'1 серия',link:fallbackLink});
      }

      return {
        id:String((tr.id)||idx),
        label:title+' ('+typeLabel+(item.quality?(' • '+item.quality):'')+')',
        shortLabel:title,
        type:typeLabel,
        quality:item.quality||'720p',
        episodes:episodes
      };
    });
  }

  function buildEmbedUrl(rawLink){
    var clean=rawLink.indexOf('//')===0?('https:'+rawLink):rawLink;
    try{
      var u=new URL(clean);
      u.searchParams.set('hide_selectors','true');
      return u.toString();
    }catch(e){
      var sep=clean.indexOf('?')!==-1?'&':'?';
      return clean+sep+'hide_selectors=true';
    }
  }

  function mountIframe(embedLink){
    currentSrc=embedLink;
    if(!activeIframe){
      activeIframe=document.createElement('iframe');
      activeIframe.setAttribute('allowfullscreen','true');
      activeIframe.setAttribute('allow','autoplay; fullscreen; picture-in-picture');
      stage.insertBefore(activeIframe,stage.firstChild);
    }
    activeIframe.src=buildEmbedUrl(embedLink);
    wakeHud();
  }

  function loadEpisode(targetEIdx,userTriggered){
    if(!ctxData||!ctxData.variants[vIdx])return;
    var eps=ctxData.variants[vIdx].episodes||[];
    if(targetEIdx<0||targetEIdx>=eps.length)return;
    eIdx=targetEIdx;
    var ep=eps[eIdx];
    epCurLbl.textContent=ep.label;
    voiceCurLbl.textContent=ctxData.variants[vIdx].shortLabel;
    mountIframe(ep.link);

    if(userTriggered&&roomState.active&&roomState.isHost){
      broadcastRoomAction({type:'CHANGE_EP',eIdx:eIdx,vIdx:vIdx,src:ep.link});
    }
  }

  function openEpModal(){
    epGrid.innerHTML='';
    var eps=((ctxData&&ctxData.variants&&ctxData.variants[vIdx]&&ctxData.variants[vIdx].episodes)||[]);
    eps.forEach(function(ep,i){
      var b=document.createElement('button');
      b.type='button';
      b.className='ep-tile'+(i===eIdx?' active':'');
      b.textContent=ep.e;
      b.onclick=function(e){
        e.stopPropagation();
        epModal.style.display='none';
        if(i!==eIdx)loadEpisode(i,true);
      };
      epGrid.appendChild(b);
    });
    epModal.style.display='flex';
  }

  function openVoiceModal(){
    voiceList.innerHTML='';
    ((ctxData&&ctxData.variants)||[]).forEach(function(v,i){
      var b=document.createElement('button');
      b.type='button';
      b.className='ep-tile'+(i===vIdx?' active':'');
      b.style.textAlign='left';
      b.style.padding='10px 14px';
      b.textContent=v.label;
      b.onclick=function(e){
        e.stopPropagation();
        voiceModal.style.display='none';
        if(i===vIdx)return;
        vIdx=i;
        var newEps=(ctxData.variants[vIdx]&&ctxData.variants[vIdx].episodes)||[];
        eIdx=0;
        if(newEps[0]){
          loadEpisode(0,true);
        }
      };
      voiceList.appendChild(b);
    });
    voiceModal.style.display='flex';
  }

  epPickerBtn.onclick=function(e){e.stopPropagation();openEpModal();};
  voicePickerBtn.onclick=function(e){e.stopPropagation();openVoiceModal();};
  epCloseBtn.onclick=function(e){e.stopPropagation();epModal.style.display='none';};
  voiceCloseBtn.onclick=function(e){e.stopPropagation();voiceModal.style.display='none';};
  epModal.onclick=function(){epModal.style.display='none';};
  voiceModal.onclick=function(){voiceModal.style.display='none';};

  function selectRelease(group){
    sourceModal.style.display='none';
    var clean=group.title;
    titleLbl.textContent=clean;
    document.title=clean+' — Kodik Player';

    var parsed=parseGroupVariants(group.variants);
    ctxData={groupKey:group.groupKey,title:clean,variants:parsed};
    vIdx=0;
    eIdx=0;
    loadEpisode(0,true);
  }

  function renderSearchCards(groups){
    searchResultsList.innerHTML='';
    groups.forEach(function(g){
      var card=document.createElement('div');
      card.className='search-result-card';
      var img=document.createElement('img');
      img.className='search-card-poster';
      if(g.poster)img.src=g.poster.indexOf('//')===0?('https:'+g.poster):g.poster;
      card.appendChild(img);

      var meta=document.createElement('div');
      meta.className='search-card-meta';
      var tDiv=document.createElement('div');
      tDiv.className='search-card-title';
      tDiv.textContent=g.title;
      meta.appendChild(tDiv);

      var subDiv=document.createElement('div');
      subDiv.className='search-card-sub';
      subDiv.textContent=(g.year?(g.year+' · '):'')+'Озвучек: '+g.variantsCount;
      meta.appendChild(subDiv);

      card.appendChild(meta);
      card.onclick=function(){
        selectRelease(g);
      };
      searchResultsList.appendChild(card);
    });
  }

  var searchTimer=null;
  function performLiveSearch(q){
    var spec=parseSearchTarget(q);
    if(!spec)return;
    queryKodik(spec).then(function(results){
      if(!results||!results.length){
        searchResultsList.innerHTML='<div style="padding:16px;text-align:center;font-size:12px;color:#a1a1aa">Ничего не найдено</div>';
        return;
      }
      var groups=groupKodikResults(results);
      renderSearchCards(groups);
    });
  }

  sourceUrlInput.oninput=function(){
    var q=sourceUrlInput.value.trim();
    if(searchTimer)clearTimeout(searchTimer);
    if(q.length<2){searchResultsList.innerHTML='';return;}
    searchTimer=setTimeout(function(){
      performLiveSearch(q);
    },280);
  };

  function openSearchModal(){
    sourceUrlInput.value='';
    sourceModal.style.display='flex';
    sourceUrlInput.focus();
    if(!searchResultsList.children.length){
      performLiveSearch('Клинок');
    }
  }

  titleLbl.onclick=function(e){e.stopPropagation();openSearchModal();};
  backBtn.onclick=function(e){e.stopPropagation();openSearchModal();};
  closeSourceBtn.onclick=function(){sourceModal.style.display='none';};

  fsBtn.onclick=function(e){
    e.stopPropagation();
    if(!document.fullscreenElement){
      var el=document.documentElement;
      if(el.requestFullscreen)el.requestFullscreen().catch(function(){});
    }else{
      if(document.exitFullscreen)document.exitFullscreen().catch(function(){});
    }
  };

  function broadcastRoomAction(packet){
    var payload=JSON.stringify(packet);
    roomState.conns.forEach(function(c){
      if(c&&c.open)c.send(payload);
    });
  }

  function handleIncomingPacket(packet){
    if(!packet)return;
    if(packet.type==='CHANGE_EP'){
      if(packet.vIdx!==undefined)vIdx=packet.vIdx;
      if(packet.eIdx!==undefined){
        eIdx=packet.eIdx;
        loadEpisode(eIdx,false);
      }
    }
  }

  function updateRoomUI(){
    if(!roomState.active){
      roomBtn.classList.remove('room-active');
      roomBtnLbl.textContent='Создать комнату';
    }else{
      roomBtn.classList.add('room-active');
      roomBtnLbl.textContent='Онлайн: '+(roomState.users.length||1);
    }
  }

  function initHostRoom(nick){
    var rId='room-'+Math.random().toString(36).slice(2,8);
    var peer=new window.Peer(rId);
    roomState.peer=peer;
    roomState.roomId=rId;
    roomState.isHost=true;
    roomState.active=true;
    roomState.myNick=nick;
    roomState.users=[{name:nick,role:'Хост'}];
    updateRoomUI();
    flash('Комната '+rId+' открыта');

    peer.on('connection',function(conn){
      roomState.conns.push(conn);
      conn.on('data',function(data){
        try{
          var p=JSON.parse(data);
          if(p.type==='JOIN_HELLO'){
            roomState.users.push({name:p.name||'Гость',role:'Зритель'});
            updateRoomUI();
            conn.send(JSON.stringify({
              type:'INIT_STATE',
              vIdx:vIdx,
              eIdx:eIdx,
              title:ctxData?ctxData.title:'',
              src:currentSrc
            }));
          }
        }catch(e){}
      });
    });
  }

  function initClientRoom(targetRoomId,nick){
    var peer=new window.Peer();
    roomState.peer=peer;
    roomState.roomId=targetRoomId;
    roomState.isHost=false;
    roomState.active=true;
    roomState.myNick=nick;

    peer.on('open',function(){
      var conn=peer.connect(targetRoomId);
      roomState.hostConn=conn;
      conn.on('open',function(){
        flash('Подключено к '+targetRoomId);
        updateRoomUI();
        conn.send(JSON.stringify({type:'JOIN_HELLO',name:nick}));
      });
      conn.on('data',function(data){
        try{
          var p=JSON.parse(data);
          if(p.type==='INIT_STATE'){
            if(p.src&&p.src!==currentSrc){
              mountIframe(p.src);
            }
          }else{
            handleIncomingPacket(p);
          }
        }catch(e){}
      });
    });
  }

  roomBtn.onclick=function(e){
    e.stopPropagation();
    if(!roomState.active){
      createNickInput.value=localStorage.getItem('kp_nick')||'';
      createRoomModal.style.display='flex';
    }else{
      manageModalTitle.textContent='Комната '+roomState.roomId;
      roomLinkDisplay.textContent=window.location.origin+window.location.pathname+'?room='+roomState.roomId;
      roomUsersList.innerHTML='';
      roomState.users.forEach(function(u){
        var row=document.createElement('div');
        row.className='user-item';
        var nm=document.createElement('span');
        nm.className='user-name';
        nm.textContent=u.name+' · '+u.role;
        row.appendChild(nm);
        roomUsersList.appendChild(row);
      });
      manageRoomModal.style.display='flex';
    }
  };

  closeCreateRoomBtn.onclick=function(){createRoomModal.style.display='none';};
  closeJoinRoomBtn.onclick=function(){joinRoomModal.style.display='none';};
  closeManageRoomBtn.onclick=function(){manageRoomModal.style.display='none';};

  switchToJoinBtn.onclick=function(){
    createRoomModal.style.display='none';
    joinRoomIdInput.value='';
    joinNickInput.value=createNickInput.value.trim()||(localStorage.getItem('kp_nick')||'');
    joinRoomModal.style.display='flex';
  };

  startRoomSubmitBtn.onclick=function(){
    var nick=createNickInput.value.trim()||'Хост';
    localStorage.setItem('kp_nick',nick);
    createRoomModal.style.display='none';
    initHostRoom(nick);
  };

  connectRoomSubmitBtn.onclick=function(){
    var targetId=joinRoomIdInput.value.trim();
    var nick=joinNickInput.value.trim()||'Гость';
    if(!targetId)return;
    localStorage.setItem('kp_nick',nick);
    joinRoomModal.style.display='none';
    initClientRoom(targetId,nick);
  };

  copyRoomLinkBtn.onclick=function(){
    var link=window.location.origin+window.location.pathname+'?room='+roomState.roomId;
    if(navigator.clipboard){
      navigator.clipboard.writeText(link).then(function(){flash('Ссылка скопирована');});
    }
  };

  leaveRoomBtn.onclick=function(){
    if(roomState.peer)roomState.peer.destroy();
    roomState.active=false;
    roomState.roomId='';
    roomState.conns=[];
    roomState.hostConn=null;
    roomState.users=[];
    updateRoomUI();
    manageRoomModal.style.display='none';
    flash('Вы вышли из комнаты');
  };

  window.addEventListener('message',function(event){
    if(!event.data||typeof event.data!=='object')return;
    var k=event.data.key;
    if(k==='kodik_player_video_ended'){
      if(ctxData&&ctxData.variants[vIdx]&&eIdx+1<(ctxData.variants[vIdx].episodes.length)){
        loadEpisode(eIdx+1,true);
      }
    }
  });

  var qParams=new URLSearchParams(window.location.search);
  var initRoom=qParams.get('room');
  var initGk=qParams.get('gk');
  var initSrc=qParams.get('src');

  if(initRoom){
    joinRoomIdInput.value=initRoom;
    joinRoomModal.style.display='flex';
  }

  if(initSrc){
    mountIframe(initSrc);
  }else if(initGk){
    var spec=initGk.indexOf('shiki:')===0?{shikimori_id:initGk.slice(6)}:{title:initGk};
    queryKodik(spec).then(function(res){
      if(res&&res.length){
        var grps=groupKodikResults(res);
        if(grps.length)selectRelease(grps[0]);
      }
    });
  }else{
    openSearchModal();
  }

  wakeHud();
})();
</script>
</body>
</html>
