<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Kodik Player & Watch Party</title>
<style>
:root{--sheet-bg:rgba(24,24,27,0.95);--panel-bg:rgba(28,28,30,0.92);--text-main:#ffffff;--text-sub:#a1a1aa;--tile-bg:rgba(255,255,255,0.22);--accent-green:#10b981;--accent-red:#ef4444;--accent-blue:#3b82f6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;color:var(--text-main);overflow:hidden;font-family:system-ui,-apple-system,sans-serif;user-select:none}
.app{position:relative;display:flex;flex-direction:column;width:100%;height:100%;background:#000}
.stage{position:relative;flex:1;min-height:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
video,iframe{width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;background:#000;border:0;outline:none}
.top-bar{position:absolute;top:0;left:0;right:0;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top, 0px)) 14px 10px;background:linear-gradient(180deg,rgba(0,0,0,0.95) 0%,rgba(0,0,0,0.65) 75%,transparent 100%);z-index:30;transition:opacity .25s ease}
.top-row{display:flex;align-items:center;justify-content:space-between;width:100%;gap:8px}
.top-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.top-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.title-text{font-size:14px;font-weight:700;color:var(--text-main);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:32px;cursor:pointer}
.sub-bar{display:flex;align-items:center;gap:8px;margin-top:6px;padding-left:42px}
.pill-btn{background:var(--tile-bg);border:0;color:var(--text-main);border-radius:8px;padding:6px 12px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:6px;cursor:pointer;outline:none;line-height:normal;box-shadow:0 8px 24px rgba(0,0,0,0.4);transition:transform .12s ease,background .15s ease}
.pill-btn:active{transform:scale(0.92);background:rgba(255,255,255,0.38);color:#ffffff}
.pill-btn.room-active{background:rgba(16,185,129,0.32);border:1px solid rgba(16,185,129,0.6)}
.room-indicator{width:7px;height:7px;border-radius:50%;background:var(--accent-green);box-shadow:0 0 8px var(--accent-green);display:inline-block}
.icon-btn{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;background:var(--tile-bg);border:0;color:var(--text-main);cursor:pointer;outline:none;flex-shrink:0;box-shadow:0 8px 24px rgba(0,0,0,0.4);transition:transform .12s ease,background .15s ease}
.icon-btn:active{transform:scale(0.92);background:rgba(255,255,255,0.38);color:#ffffff}
.center-ctrls{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:36px;z-index:28;transition:opacity .25s ease;pointer-events:none}
.c-btn{width:56px;height:56px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--tile-bg);border:0;color:#fff;cursor:pointer;outline:none;box-shadow:0 8px 24px rgba(0,0,0,0.4);transition:transform .12s ease,background .15s ease;pointer-events:auto}
.c-btn:active{transform:scale(0.92);background:rgba(255,255,255,0.38)}
.c-play{width:70px;height:70px;background:var(--tile-bg);border:0;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,0.4)}
.c-play:active{background:rgba(255,255,255,0.38)}
.c-btn svg{width:24px;height:24px;fill:currentColor}
.c-play svg{width:32px;height:32px;fill:currentColor}
.bottom-bar{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:6px;padding:12px 14px calc(10px + env(safe-area-inset-top, 0px));background:linear-gradient(0deg,rgba(0,0,0,0.95) 0%,rgba(0,0,0,0.65) 70%,transparent 100%);z-index:30;transition:opacity .25s ease}
.timeline-box{position:relative;width:100%;height:20px;display:flex;align-items:center;cursor:pointer}
.timeline-track{position:absolute;left:0;right:0;height:4px;background:rgba(255,255,255,0.18);border-radius:2px;pointer-events:none}
.timeline-buffer{position:absolute;left:0;height:4px;background:rgba(255,255,255,0.42);border-radius:2px;width:0%;pointer-events:none;transition:width .12s linear}
.timeline-played{position:absolute;left:0;height:4px;background:#ffffff;border-radius:2px;width:0%;pointer-events:none}
.timeline-seek{position:absolute;left:0;right:0;width:100%;height:20px;margin:0;padding:0;background:transparent;outline:none;border:0;-webkit-appearance:none;cursor:pointer;z-index:2}
.timeline-seek::-webkit-slider-runnable-track{height:20px;background:transparent;border:0}
.timeline-seek::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:#ffffff;border:0;outline:none;margin-top:3px;box-shadow:0 1px 4px rgba(0,0,0,0.6)}
.b-row{display:flex;align-items:center;justify-content:space-between;height:28px}
.time-lbl{font-size:13px;font-variant-numeric:tabular-nums;color:var(--text-main);font-weight:700;display:inline-flex;align-items:center;height:28px;line-height:28px;letter-spacing:0.3px}
.b-actions{display:flex;align-items:center;gap:8px;height:28px}
.skip-btn{width:34px;height:28px;border-radius:7px;background:var(--tile-bg);border:0;color:var(--text-main);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;line-height:1;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,0.4);transition:transform .12s ease,background .15s ease}
.skip-btn:active{transform:scale(0.92);background:rgba(255,255,255,0.38);color:#ffffff}
.pip-btn{width:32px;height:28px;border-radius:7px;background:var(--tile-bg);border:0;color:var(--text-main);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,0.4);transition:transform .12s ease,background .15s ease}
.pip-btn:active{transform:scale(0.92);background:rgba(255,255,255,0.38);color:#ffffff}
.fs-btn{width:28px;height:28px;border-radius:7px;background:var(--tile-bg);border:0;color:var(--text-main);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,0.4);transition:transform .12s ease,background .15s ease}
.fs-btn:active{transform:scale(0.92);background:rgba(255,255,255,0.38);color:#ffffff}
.toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--panel-bg);border:0;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:600;text-align:center;max-width:86%;z-index:45;box-shadow:0 12px 30px rgba(0,0,0,0.9);display:none}
.badge{position:absolute;top:18%;left:50%;transform:translateX(-50%);background:var(--panel-bg);border:0;padding:6px 14px;border-radius:8px;font-size:12px;font-weight:700;display:none;pointer-events:none;z-index:40}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(6px);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.modal-sheet{width:100%;max-width:440px;background:var(--sheet-bg);border-radius:18px;border:1px solid rgba(255,255,255,0.12);padding:18px;max-height:86%;display:flex;flex-direction:column;box-shadow:0 20px 40px rgba(0,0,0,0.8)}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,0.12)}
.modal-title{font-size:15px;font-weight:700;color:var(--text-main)}
.modal-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;overflow-y:auto;padding:12px 0;max-height:48vh}
.ep-tile{padding:10px 4px;font-size:11px;font-weight:700;text-align:center;background:var(--tile-bg);border:0;color:var(--text-main);border-radius:8px;cursor:pointer}
.ep-tile.active{background:#ffffff;color:#121212;box-shadow:0 4px 14px rgba(255,255,255,0.3)}
.dropdown{position:absolute;background:rgba(28,28,30,0.96);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:4px;z-index:70;display:none;flex-direction:column;box-shadow:0 12px 30px rgba(0,0,0,0.9);max-height:242px;overflow-y:auto}
.drop-item{padding:8px 14px;font-size:12px;font-weight:600;color:var(--text-main);background:transparent;border:0;text-align:left;cursor:pointer;border-radius:6px}
.drop-item.active{color:#121212;background:#ffffff}
.lock-unlock-btn{position:absolute;top:calc(10px + env(safe-area-inset-top, 0px));right:14px;height:32px;background:var(--tile-bg);border:0;color:#fff;padding:0 14px;border-radius:8px;font-size:12px;font-weight:700;z-index:80;display:none;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,0.4);transition:transform .12s ease,background .15s ease}
.lock-unlock-btn:active{transform:scale(0.92);background:rgba(255,255,255,0.38)}
.form-group{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.form-label{font-size:12px;font-weight:600;color:var(--text-sub)}
.form-input{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:10px;padding:10px 14px;color:#fff;font-size:14px;outline:none;transition:border-color .15s ease}
.form-input:focus{border-color:rgba(255,255,255,0.5)}
.action-btn{background:#ffffff;color:#121212;border:0;border-radius:10px;padding:12px;font-size:13px;font-weight:700;cursor:pointer;outline:none;margin-top:16px;box-shadow:0 4px 14px rgba(255,255,255,0.25);transition:opacity .15s ease,transform .12s ease}
.action-btn:active{transform:scale(0.96);opacity:0.9}
.action-btn.secondary{background:rgba(255,255,255,0.15);color:#fff;box-shadow:none;margin-top:8px}
.action-btn.danger{background:rgba(239,68,68,0.25);color:#ef4444;border:1px solid rgba(239,68,68,0.4);box-shadow:none}
.room-link-box{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.06);padding:8px 12px;border-radius:10px;margin-top:12px;border:1px dashed rgba(255,255,255,0.2)}
.room-link-text{flex:1;font-size:12px;color:var(--text-sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copy-btn{background:var(--tile-bg);border:0;color:#fff;border-radius:6px;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0}
.user-list{display:flex;flex-direction:column;gap:8px;max-height:220px;overflow-y:auto;margin-top:14px;padding-right:2px}
.user-item{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,0.06);padding:8px 12px;border-radius:8px}
.user-info{display:flex;align-items:center;gap:8px;min-width:0}
.user-name{font-size:13px;font-weight:600;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.role-badge{font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;text-transform:uppercase}
.role-host{background:rgba(245,158,11,0.25);color:#f59e0b;border:1px solid rgba(245,158,11,0.4)}
.role-admin{background:rgba(59,130,246,0.25);color:#3b82f6;border:1px solid rgba(59,130,246,0.4)}
.role-viewer{background:rgba(161,161,170,0.2);color:#a1a1aa}
.user-actions{display:flex;align-items:center;gap:6px}
.btn-sm{padding:4px 8px;border-radius:6px;font-size:10px;font-weight:700;cursor:pointer;border:0}
.btn-promote{background:rgba(59,130,246,0.3);color:#93c5fd}
.btn-kick{background:rgba(239,68,68,0.3);color:#fca5a5}
body.hud-off .top-bar,body.hud-off .center-ctrls,body.hud-off .bottom-bar{opacity:0;pointer-events:none}
body.locked .top-bar,body.locked .center-ctrls,body.locked .bottom-bar{display:none!important}
body.mode-iframe .center-ctrls,body.mode-iframe .bottom-bar{display:none!important}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.light.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
<div class="app" id="appRoot">
  <div class="stage" id="stage">
    <video id="vid" playsinline preload="auto"></video>
    <div class="toast" id="toast"></div>
    <div class="badge" id="badge"></div>
    <button class="lock-unlock-btn" id="unlockBtn">Разблокировать экран</button>
    <div class="top-bar" id="topBar">
      <div class="top-row">
        <div class="top-left">
          <button class="icon-btn" id="backBtn" title="Сменить видео"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
          <div class="title-text" id="titleLbl" title="Нажмите для смены источника">Kodik Player</div>
        </div>
        <div class="top-right">
          <button class="pill-btn" id="roomBtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span id="roomBtnLbl">Создать комнату</span></button>
          <button class="pill-btn" id="speedBtn"><span id="speedLbl">1.0x</span> ▾</button>
          <button class="pill-btn" id="qualityBtn"><span id="qualityLbl">720p</span> ▾</button>
          <button class="icon-btn" id="lockBtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg></button>
        </div>
      </div>
      <div class="sub-bar">
        <button class="pill-btn" id="epPickerBtn"><span id="epCurLbl">1 серия</span> ▾</button>
        <button class="pill-btn" id="voicePickerBtn"><span id="voiceCurLbl">Озвучка</span> ▾</button>
      </div>
    </div>
    <div class="center-ctrls" id="centerCtrls">
      <button class="c-btn" id="cPrevBtn"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
      <button class="c-btn c-play" id="cPlayBtn"><svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="c-btn" id="cNextBtn"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
    </div>
    <div class="bottom-bar" id="bottomBar">
      <div class="timeline-box" id="timelineBox">
        <div class="timeline-track"></div>
        <div class="timeline-buffer" id="timelineBuffer"></div>
        <div class="timeline-played" id="timelinePlayed"></div>
        <input id="seek" class="timeline-seek" type="range" min="0" max="1000" step="1" value="0">
      </div>
      <div class="b-row">
        <span class="time-lbl" id="timeLbl">00:00 / 00:00</span>
        <div class="b-actions">
          <button class="skip-btn" id="skip125Btn" title="Пропуск 1:25">»</button>
          <button class="pip-btn" id="miniPipBtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><rect x="12" y="11" width="7" height="6" rx="1" fill="currentColor" stroke="none"/></svg></button>
          <button class="fs-btn" id="fsBtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg></button>
        </div>
      </div>
    </div>
    <div class="dropdown" id="speedDrop"></div>
    <div class="dropdown" id="qualityDrop"></div>

    <div class="modal-bg" id="createRoomModal">
      <div class="modal-sheet">
        <div class="modal-hdr">
          <span class="modal-title">Создать комнату совместного просмотра</span>
          <button class="pill-btn" id="closeCreateRoomBtn">✕</button>
        </div>
        <div class="form-group">
          <label class="form-label">Ваше имя (обязательно):</label>
          <input class="form-input" id="createNickInput" type="text" placeholder="Например: Иван" maxlength="24">
        </div>
        <div class="form-group">
          <label class="form-label">Пароль комнаты (необязательно):</label>
          <input class="form-input" id="createPassInput" type="password" placeholder="Оставьте пустым, если без пароля">
        </div>
        <button class="action-btn" id="startRoomSubmitBtn">Открыть сервер комнаты</button>
        <button class="action-btn secondary" id="switchToJoinBtn">Войти в существующую по ID</button>
      </div>
    </div>

    <div class="modal-bg" id="joinRoomModal">
      <div class="modal-sheet">
        <div class="modal-hdr">
          <span class="modal-title">Вход в комнату</span>
          <button class="pill-btn" id="closeJoinRoomBtn">✕</button>
        </div>
        <div class="form-group">
          <label class="form-label">ID комнаты:</label>
          <input class="form-input" id="joinRoomIdInput" type="text" placeholder="room-xxxxxx">
        </div>
        <div class="form-group">
          <label class="form-label">Ваше имя (обязательно):</label>
          <input class="form-input" id="joinNickInput" type="text" placeholder="Введите никнейм" maxlength="24">
        </div>
        <div class="form-group" id="joinPassGroup">
          <label class="form-label">Пароль комнаты (если установлен):</label>
          <input class="form-input" id="joinPassInput" type="password" placeholder="Введите пароль">
        </div>
        <button class="action-btn" id="connectRoomSubmitBtn">Подключиться к просмотру</button>
      </div>
    </div>

    <div class="modal-bg" id="manageRoomModal">
      <div class="modal-sheet">
        <div class="modal-hdr">
          <span class="modal-title" id="manageModalTitle">Комната просмотра</span>
          <button class="pill-btn" id="closeManageRoomBtn">✕</button>
        </div>
        <div class="room-link-box">
          <span class="room-link-text" id="roomLinkDisplay">Загрузка...</span>
          <button class="copy-btn" id="copyRoomLinkBtn">Скопировать</button>
        </div>
        <div class="form-label" style="margin-top:12px">Участники онлайн:</div>
        <div class="user-list" id="roomUsersList"></div>
        <button class="action-btn danger" id="leaveRoomBtn">Выйти из комнаты</button>
      </div>
    </div>

    <div class="modal-bg" id="sourceModal">
      <div class="modal-sheet">
        <div class="modal-hdr">
          <span class="modal-title">Открыть видео / поток</span>
          <button class="pill-btn" id="closeSourceBtn">✕</button>
        </div>
        <div class="form-group">
          <label class="form-label">Ссылка на видео (m3u8, mp4 или Kodik embed):</label>
          <input class="form-input" id="sourceUrlInput" type="text" placeholder="https://...m3u8 или //kodik...">
        </div>
        <div class="form-group">
          <label class="form-label">Название тайтла:</label>
          <input class="form-input" id="sourceTitleInput" type="text" placeholder="Название видео">
        </div>
        <button class="action-btn" id="loadSourceSubmitBtn">Загрузить в плеер</button>
      </div>
    </div>

    <div class="modal-bg" id="epModal">
      <div class="modal-sheet">
        <div class="modal-hdr">
          <span class="modal-title">Выберите серию</span>
          <button class="pill-btn" id="epCloseBtn">✕</button>
        </div>
        <div class="modal-grid" id="epGrid"></div>
      </div>
    </div>

    <div class="modal-bg" id="voiceModal">
      <div class="modal-sheet">
        <div class="modal-hdr">
          <span class="modal-title">Выберите озвучку</span>
          <button class="pill-btn" id="voiceCloseBtn">✕</button>
        </div>
        <div class="modal-grid" style="grid-template-columns:1fr;max-height:45vh" id="voiceList"></div>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  var FS_EXPAND_SVG='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>';

  });

  vid.addEventListener('pause',function(){
    playIcon.innerHTML='<path d="M8 5v14l11-7z"/>';
    document.body.classList.remove('hud-off');
    if(roomState.active&&(roomState.isHost||roomState.isAdmin)&&!roomState.ignoreNextSync){
      sendRoomPacket({type:'PAUSE',time:vid.currentTime||0});
    }
    roomState.ignoreNextSync=false;
  });

  vid.addEventListener('timeupdate',function(){
    var cur=vid.currentTime||0,dur=vid.duration||0;
    if(!draggingSeek&&dur>0){seek.value=String(Math.round((cur/dur)*1000));}
    timeLbl.textContent=fmtTime(cur)+' / '+fmtTime(dur);
    updateTimelineProgress();
  });

  vid.addEventListener('progress',updateTimelineProgress);
  vid.addEventListener('ended',function(){goToNextEp(false);});

  function getShareUrl(roomId){
    var u=new URL(window.location.href);
    u.searchParams.set('room',roomId);
    if(initialSrc)u.searchParams.set('src',initialSrc);
    if(titleLbl.textContent)u.searchParams.set('title',titleLbl.textContent);
    return u.toString();
  }

  function updateRoomButtonUI(){
    if(!roomState.active){
      roomBtn.classList.remove('room-active');
      roomBtn.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Создать комнату</span>';
    }else{
      roomBtn.classList.add('room-active');
      var cnt=roomState.users.length||1;
      roomBtn.innerHTML='<span class="room-indicator"></span> <span>Онлайн: '+cnt+'</span> ▾';
    }
  }

  function renderRoomUsers(){
    roomUsersList.innerHTML='';
    roomState.users.forEach(function(u){
      var row=document.createElement('div');row.className='user-item';
      var info=document.createElement('div');info.className='user-info';
      var nm=document.createElement('span');nm.className='user-name';
      nm.textContent=u.name+(u.id===roomState.myId?' (Вы)':'');
      var badge=document.createElement('span');
      badge.className='role-badge '+(u.role==='host'?'role-host':(u.role==='admin'?'role-admin':'role-viewer'));
      badge.textContent=u.role==='host'?'Хост':(u.role==='admin'?'Админ':'Зритель');
      info.appendChild(nm);info.appendChild(badge);
      row.appendChild(info);

      var actions=document.createElement('div');actions.className='user-actions';
      if(roomState.isHost&&u.id!==roomState.myId){
        if(u.role!=='admin'){
          var promBtn=document.createElement('button');promBtn.className='btn-sm btn-promote';promBtn.textContent='Сделать админом';
          promBtn.onclick=function(){promoteUserToAdmin(u.id);};
          actions.appendChild(promBtn);
        }
      }
      if((roomState.isHost||roomState.isAdmin)&&u.id!==roomState.myId&&u.role!=='host'){
        var kickBtn=document.createElement('button');kickBtn.className='btn-sm btn-kick';kickBtn.textContent='Выгнать';
        kickBtn.onclick=function(){kickUserFromRoom(u.id);};
        actions.appendChild(kickBtn);
      }
      row.appendChild(actions);
      roomUsersList.appendChild(row);
    });
  }

  function sendRoomPacket(pkt){
    pkt.senderId=roomState.myId;
    pkt.senderNick=roomState.myNick;
    if(roomState.bcastChannel){
      try{roomState.bcastChannel.postMessage(pkt);}catch(e){}
    }
    if(roomState.isHost){
      Object.keys(roomState.connections).forEach(function(k){
        var conn=roomState.connections[k];
        if(conn&&conn.open){try{conn.send(pkt);}catch(e){}}
      });
    }else if(roomState.hostConn&&roomState.hostConn.open){
      try{roomState.hostConn.send(pkt);}catch(e){}
    }
  }

  function handleRoomPacket(pkt){
    if(!pkt||pkt.senderId===roomState.myId)return;
    if(pkt.type==='JOIN_REQUEST'){
      if(!roomState.isHost)return;
      if(roomState.roomPass&&pkt.pass!==roomState.roomPass){
        var badConn=roomState.connections[pkt.peerId];
        if(badConn){badConn.send({type:'JOIN_REJECT',reason:'Неверный пароль комнаты'});setTimeout(function(){badConn.close();},300);}
        return;
      }
      var existing=roomState.users.find(function(x){return x.id===pkt.peerId;});
      if(!existing){
        roomState.users.push({id:pkt.peerId,name:pkt.name||'Зритель',role:'viewer'});
      }
      updateRoomButtonUI();
      renderRoomUsers();
      var acceptConn=roomState.connections[pkt.peerId];
      if(acceptConn&&acceptConn.open){
        acceptConn.send({
          type:'JOIN_ACCEPT',
          roomId:roomState.roomId,
          users:roomState.users,
          state:{
            time:vid.currentTime||0,
            paused:Boolean(vid.paused),
            rate:rate,
            src:initialSrc,
            title:titleLbl.textContent,
            vIdx:vIdx,
            eIdx:eIdx
          }
        });
      }
      sendRoomPacket({type:'SYNC_USERS',users:roomState.users});
      flash('Вошёл: '+(pkt.name||'Зритель'));
      return;
    }

    if(pkt.type==='JOIN_ACCEPT'){
      roomState.active=true;
      roomState.users=pkt.users||[];
      var me=roomState.users.find(function(u){return u.id===roomState.myId;});
      if(me){roomState.isAdmin=(me.role==='admin'||me.role==='host');}
      updateRoomButtonUI();
      renderRoomUsers();
      flash('Подключено к комнате!');
      if(pkt.state){
        if(pkt.state.title)titleLbl.textContent=pkt.state.title;
        if(pkt.state.rate)setRate(pkt.state.rate,false);
        if(pkt.state.src&&pkt.state.src!==initialSrc){
          initialSrc=pkt.state.src;
          mountStream(initialSrc,pkt.state.time||0);
        }else if(pkt.state.time!==undefined){
          vid.currentTime=pkt.state.time;
        }
        if(pkt.state.paused){vid.pause();}else{vid.play().catch(function(){});}
      }
      return;
    }

    if(pkt.type==='JOIN_REJECT'){
      flash(pkt.reason||'Ошибка входа');
      leaveRoom();
      return;
    }

    if(pkt.type==='SYNC_USERS'){
      roomState.users=pkt.users||[];
      var selfUser=roomState.users.find(function(u){return u.id===roomState.myId;});
      if(selfUser){roomState.isAdmin=(selfUser.role==='admin'||selfUser.role==='host');}
      updateRoomButtonUI();
      renderRoomUsers();
      return;
    }

    if(pkt.type==='PLAY'){
      roomState.ignoreNextSync=true;
      if(pkt.time!==undefined&&Math.abs((vid.currentTime||0)-pkt.time)>1.5){
        vid.currentTime=pkt.time;
      }
      vid.play().catch(function(){});
      flash('Воспроизведение (хост)');
      return;
    }

    if(pkt.type==='PAUSE'){
      roomState.ignoreNextSync=true;
      if(pkt.time!==undefined)vid.currentTime=pkt.time;
      vid.pause();
      flash('Пауза (хост)');
      return;
    }

    if(pkt.type==='SEEK'){
      if(pkt.time!==undefined){
        vid.currentTime=pkt.time;
        flash('Перемотка: '+fmtTime(pkt.time));
      }
      return;
    }

    if(pkt.type==='RATE'){
      if(pkt.rate!==undefined)setRate(pkt.rate,false);
      return;
    }

    if(pkt.type==='CHANGE_EP'){
      if(pkt.eIdx!==undefined)eIdx=pkt.eIdx;
      if(pkt.vIdx!==undefined)vIdx=pkt.vIdx;
      loadCurrent(0);
      flash('Смена серии');
      return;
    }

    if(pkt.type==='LOAD_MEDIA'){
      if(pkt.src){
        initialSrc=pkt.src;
        titleLbl.textContent=pkt.title||'Kodik Video';
        mountStream(pkt.src,0);
        flash('Новое видео: '+titleLbl.textContent);
      }
      return;
    }

    if(pkt.type==='PROMOTE'){
      if(pkt.targetId===roomState.myId){
        roomState.isAdmin=true;
        flash('Вы назначены администратором комнаты');
      }
      return;
    }

    if(pkt.type==='KICK'){
      if(pkt.targetId===roomState.myId){
        leaveRoom();
        flash('Вы были исключены из комнаты');
      }
      return;
    }
  }

  function initHostServer(nick,pass){
    var genRoomId='room-'+Math.floor(100000+Math.random()*900000);
    roomState.isHost=true;
    roomState.isAdmin=true;
    roomState.roomId=genRoomId;
    roomState.roomPass=pass||'';
    roomState.myNick=nick;
    roomState.myId='host-'+Math.random().toString(36).substr(2,7);
    roomState.users=[{id:roomState.myId,name:nick,role:'host'}];

    try{
      roomState.bcastChannel=new BroadcastChannel('kp_room_'+genRoomId);
      roomState.bcastChannel.onmessage=function(e){handleRoomPacket(e.data);};
    }catch(e){}

    if(window.Peer){
      try{
        var p=new window.Peer('kproom-'+genRoomId,{debug:0});
        roomState.peer=p;
        p.on('open',function(id){
          roomState.active=true;
          updateRoomButtonUI();
          renderRoomUsers();
          flash('Сервер запущен: '+genRoomId);
        });
        p.on('connection',function(conn){
          conn.on('open',function(){
            roomState.connections[conn.peer]=conn;
          });
          conn.on('data',function(data){
            if(data&&data.type==='JOIN_REQUEST'){data.peerId=conn.peer;}
            handleRoomPacket(data);
          });
          conn.on('close',function(){
            delete roomState.connections[conn.peer];
            roomState.users=roomState.users.filter(function(u){return u.id!==conn.peer;});
            updateRoomButtonUI();
            renderRoomUsers();
            sendRoomPacket({type:'SYNC_USERS',users:roomState.users});
          });
        });
        p.on('error',function(err){
          roomState.active=true;
          updateRoomButtonUI();
          renderRoomUsers();
        });
      }catch(e){
        roomState.active=true;
        updateRoomButtonUI();
        renderRoomUsers();
      }
    }else{
      roomState.active=true;
      updateRoomButtonUI();
      renderRoomUsers();
    }

    setInterval(function(){
      if(roomState.active&&roomState.isHost){
        sendRoomPacket({
          type:'HEARTBEAT_SYNC',
          time:vid.currentTime||0,
          paused:Boolean(vid.paused)
        });
      }
    },4000);
  }

  function initClientConnection(targetRoomId,nick,pass){
    roomState.isHost=false;
    roomState.isAdmin=false;
    roomState.roomId=targetRoomId;
    roomState.roomPass=pass||'';
    roomState.myNick=nick;
    roomState.myId='peer-'+Math.random().toString(36).substr(2,7);

    try{
      roomState.bcastChannel=new BroadcastChannel('kp_room_'+targetRoomId);
      roomState.bcastChannel.onmessage=function(e){handleRoomPacket(e.data);};
    }catch(e){}

    if(window.Peer){
      try{
        var p=new window.Peer({debug:0});
        roomState.peer=p;
        p.on('open',function(myPeerId){
          roomState.myId=myPeerId;
          var conn=p.connect('kproom-'+targetRoomId);
          roomState.hostConn=conn;
          conn.on('open',function(){
            conn.send({type:'JOIN_REQUEST',name:nick,pass:pass,peerId:myPeerId});
          });
          conn.on('data',function(data){handleRoomPacket(data);});
          conn.on('close',function(){
            leaveRoom();
            flash('Связь с комнатой потеряна');
          });
        });
        p.on('error',function(err){
          sendRoomPacket({type:'JOIN_REQUEST',name:nick,pass:pass,peerId:roomState.myId});
        });
      }catch(e){
        sendRoomPacket({type:'JOIN_REQUEST',name:nick,pass:pass,peerId:roomState.myId});
      }
    }else{
      sendRoomPacket({type:'JOIN_REQUEST',name:nick,pass:pass,peerId:roomState.myId});
    }
  }

  function promoteUserToAdmin(userId){
    var u=roomState.users.find(function(x){return x.id===userId;});
    if(u){
      u.role='admin';
      sendRoomPacket({type:'PROMOTE',targetId:userId});
      sendRoomPacket({type:'SYNC_USERS',users:roomState.users});
      renderRoomUsers();
      flash(u.name+' теперь админ');
    }
  }

  function kickUserFromRoom(userId){
    var u=roomState.users.find(function(x){return x.id===userId;});
    sendRoomPacket({type:'KICK',targetId:userId});
    roomState.users=roomState.users.filter(function(x){return x.id!==userId;});
    if(roomState.connections[userId]){
      try{roomState.connections[userId].close();}catch(e){}
      delete roomState.connections[userId];
    }
    sendRoomPacket({type:'SYNC_USERS',users:roomState.users});
    updateRoomButtonUI();
    renderRoomUsers();
    if(u)flash('Пользователь '+u.name+' исключен');
  }

  function leaveRoom(){
    roomState.active=false;
    roomState.isHost=false;
    roomState.isAdmin=false;
    if(roomState.peer){try{roomState.peer.destroy();}catch(e){}roomState.peer=null;}
    if(roomState.bcastChannel){try{roomState.bcastChannel.close();}catch(e){}roomState.bcastChannel=null;}
    roomState.connections={};
    roomState.hostConn=null;
    roomState.users=[];
    updateRoomButtonUI();
    manageRoomModal.style.display='none';
    flash('Вы вышли из комнаты');
  }

  roomBtn.onclick=function(e){
    e.stopPropagation();
    if(!roomState.active){
      createNickInput.value=localStorage.getItem('kp_last_nick')||'';
      createPassInput.value='';
      createRoomModal.style.display='flex';
    }else{
      manageModalTitle.textContent='Комната '+roomState.roomId;
      roomLinkDisplay.textContent=getShareUrl(roomState.roomId);
      renderRoomUsers();
      manageRoomModal.style.display='flex';
    }
  };

  closeCreateRoomBtn.onclick=function(){createRoomModal.style.display='none';};
  closeJoinRoomBtn.onclick=function(){joinRoomModal.style.display='none';};
  closeManageRoomBtn.onclick=function(){manageRoomModal.style.display='none';};

  switchToJoinBtn.onclick=function(){
    createRoomModal.style.display='none';
    joinRoomIdInput.value='';
    joinNickInput.value=createNickInput.value.trim()||(localStorage.getItem('kp_last_nick')||'');
    joinRoomModal.style.display='flex';
  };

  startRoomSubmitBtn.onclick=function(){
    var nick=createNickInput.value.trim();
    var pass=createPassInput.value.trim();
    if(!nick){alert('Пожалуйста, введите ваше имя!');return;}
    localStorage.setItem('kp_last_nick',nick);
    createRoomModal.style.display='none';
    initHostServer(nick,pass);
  };

  connectRoomSubmitBtn.onclick=function(){
    var targetId=joinRoomIdInput.value.trim();
    var nick=joinNickInput.value.trim();
    var pass=joinPassInput.value.trim();
    if(!targetId){alert('Введите ID комнаты!');return;}
    if(!nick){alert('Введите ваше имя!');return;}
    localStorage.setItem('kp_last_nick',nick);
    joinRoomModal.style.display='none';
    initClientConnection(targetId,nick,pass);
  };

  copyRoomLinkBtn.onclick=function(){
    var link=getShareUrl(roomState.roomId);
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(link).then(function(){flash('Ссылка скопирована!');}).catch(function(){prompt('Скопируйте ссылку:',link);});
    }else{
      prompt('Скопируйте ссылку:',link);
    }
  };

  leaveRoomBtn.onclick=function(){leaveRoom();};

  titleLbl.textContent=initialTitle;
  var fallbackLocal=parseFloat(localStorage.getItem('kodik_rate')||'1');
  setRate(fallbackLocal||1.0,false);

  if(initialRoomId){
    joinRoomIdInput.value=initialRoomId;
    joinNickInput.value=localStorage.getItem('kp_last_nick')||'';
    joinRoomModal.style.display='flex';
  }

  loadSourceSubmitBtn.click();
  wakeHud();
})();
</script>
</body>
</html>
