<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Kodik Player &amp; Watch Party</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--sheet-bg:rgba(24,24,27,0.96);--panel-bg:rgba(28,28,30,0.92);--text-main:#ffffff;--text-sub:#a1a1aa;--tile-bg:rgba(255,255,255,0.14);--accent-green:#10b981;--accent-red:#ef4444;--accent-blue:#3b82f6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;color:var(--text-main);overflow:hidden;font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;user-select:none}
.app{position:relative;display:flex;flex-direction:column;width:100%;height:100%;background:#000}
.stage{position:relative;flex:1;min-height:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
video{position:absolute;inset:0;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;background:#000;border:0;outline:none}
.top-bar{position:absolute;top:0;left:0;right:0;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top, 0px)) 14px 10px;background:linear-gradient(180deg,#000000 0%,rgba(0,0,0,0.92) 54%,rgba(0,0,0,0.6) 82%,transparent 100%);z-index:30;transition:opacity .25s ease}
.top-row{display:flex;align-items:center;justify-content:space-between;width:100%;gap:8px}
.top-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.top-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.title-btn{background:transparent;border:0;padding:0;font-size:14px;font-weight:700;color:var(--text-main);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:32px;cursor:pointer;text-align:left;font-family:inherit}
.sub-bar{display:flex;align-items:center;gap:8px;margin-top:6px;padding-left:4px}
.pill-btn{background:var(--tile-bg);border:0;color:var(--text-main);border-radius:8px;padding:6px 12px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:5px;cursor:pointer;outline:none;line-height:normal;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,0.4);transition:transform .12s ease,background .15s ease;font-family:inherit}
.pill-btn:active{transform:scale(0.92);background:rgba(255,255,255,0.38);color:#ffffff}
.pill-btn.room-active{background:rgba(16,185,129,0.32);border:1px solid rgba(16,185,129,0.6)}
.room-indicator{width:7px;height:7px;border-radius:50%;background:var(--accent-green);box-shadow:0 0 8px var(--accent-green);display:inline-block}
.icon-btn{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;background:var(--tile-bg);border:0;color:var(--text-main);cursor:pointer;outline:none;flex-shrink:0;box-shadow:0 8px 24px rgba(0,0,0,0.4);transition:transform .12s ease,background .15s ease}
.icon-btn:active{transform:scale(0.92);background:rgba(255,255,255,0.38);color:#ffffff}
.center-ctrls{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:36px;z-index:28;transition:opacity .25s ease;pointer-events:none}
.c-btn{width:56px;height:56px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--tile-bg);border:0;color:#fff;cursor:pointer;outline:none;box-shadow:0 8px 24px rgba(0,0,0,0.4);transition:transform .12s ease,background .15s ease;pointer-events:auto}
.c-btn:active{transform:scale(0.92);background:rgba(255,255,255,0.38)}
.c-play{width:70px;height:70px;background:rgba(28,28,32,0.92);backdrop-filter:blur(8px)}
.c-btn svg{width:24px;height:24px;fill:currentColor}
.c-play svg{width:32px;height:32px;fill:currentColor}
.bottom-bar{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:6px;padding:12px 14px calc(10px + env(safe-area-inset-bottom, 0px));background:linear-gradient(0deg,#000000 0%,rgba(0,0,0,0.95) 64%,rgba(0,0,0,0.6) 86%,transparent 100%);z-index:30;transition:opacity .25s ease}
.timeline-box{position:relative;width:100%;height:20px;display:flex;align-items:center;cursor:pointer}
.timeline-track{position:absolute;left:0;right:0;height:4px;background:rgba(255,255,255,0.18);border-radius:2px;pointer-events:none}
.timeline-buffer{position:absolute;left:0;height:4px;background:rgba(255,255,255,0.38);border-radius:2px;width:0%;pointer-events:none;transition:width .12s linear}
.timeline-played{position:absolute;left:0;height:4px;background:var(--accent-green);border-radius:2px;width:0%;pointer-events:none}
.timeline-seek{position:absolute;left:0;right:0;width:100%;height:20px;margin:0;padding:0;background:transparent;outline:none;border:0;-webkit-appearance:none;appearance:none;cursor:pointer;z-index:2}
.timeline-seek::-webkit-slider-runnable-track{height:20px;background:transparent;border:0}
.timeline-seek::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:#ffffff;border:0;outline:none;margin-top:3px;box-shadow:0 1px 4px rgba(0,0,0,0.8)}
.b-row{display:flex;align-items:center;justify-content:space-between;height:28px}
.time-lbl{font-size:13px;font-variant-numeric:tabular-nums;color:var(--text-main);font-weight:700;display:inline-flex;align-items:center;height:28px;line-height:28px}
.b-actions{display:flex;align-items:center;gap:8px;height:28px}
.skip-btn{width:36px;height:28px;border-radius:7px;background:var(--tile-bg);border:0;color:var(--text-main);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,0.4);transition:transform .12s ease,background .15s ease}
.skip-btn:active{transform:scale(0.92);background:rgba(255,255,255,0.38)}
.pip-btn,.fs-btn{width:30px;height:28px;border-radius:7px;background:var(--tile-bg);border:0;color:var(--text-main);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,0.4);transition:transform .12s ease,background .15s ease}
.toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--panel-bg);border:1px solid rgba(255,255,255,0.1);padding:10px 18px;border-radius:10px;font-size:12px;font-weight:600;text-align:center;max-width:86%;z-index:45;box-shadow:0 10px 25px rgba(0,0,0,0.85);display:none}
.badge{position:absolute;top:18%;left:50%;transform:translateX(-50%);background:var(--panel-bg);border:1px solid rgba(255,255,255,0.1);padding:6px 14px;border-radius:8px;font-size:12px;font-weight:700;display:none;pointer-events:none;z-index:40}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(4px);z-index:60;display:none;align-items:flex-end;justify-content:center}
.modal-bg.centered{align-items:center;padding:16px}
.modal-sheet{width:100%;max-width:440px;background:var(--sheet-bg);border-top-left-radius:18px;border-top-right-radius:18px;border:0;padding:16px;max-height:82%;display:flex;flex-direction:column;box-shadow:0 20px 40px rgba(0,0,0,0.85)}
.modal-bg.centered .modal-sheet{border-radius:18px;border:1px solid rgba(255,255,255,0.12)}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,0.12)}
.modal-title{font-size:14px;font-weight:700;color:var(--text-main)}
.modal-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;overflow-y:auto;padding:10px 0;max-height:48vh}
.ep-tile{padding:10px 4px;font-size:11px;font-weight:700;text-align:center;background:var(--tile-bg);border:0;color:var(--text-main);border-radius:8px;cursor:pointer}
.ep-tile.active{background:#ffffff;color:#121212;box-shadow:0 4px 14px rgba(255,255,255,0.3)}
.dropdown{position:absolute;background:rgba(28,28,30,0.96);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:4px;z-index:70;display:none;flex-direction:column;box-shadow:0 12px 30px rgba(0,0,0,0.9);max-height:242px;overflow-y:auto}
.drop-item{padding:8px 14px;font-size:12px;font-weight:600;color:var(--text-main);background:transparent;border:0;text-align:left;cursor:pointer;border-radius:6px;font-variant-numeric:tabular-nums}
.drop-item.active{color:#121212;background:#ffffff}
.lock-unlock-btn{position:absolute;top:calc(10px + env(safe-area-inset-top, 0px));right:14px;height:32px;background:var(--tile-bg);border:0;color:#fff;padding:0 14px;border-radius:8px;font-size:12px;font-weight:700;z-index:80;display:none;align-items:center;justify-content:center;cursor:pointer}
.form-group{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.form-label{font-size:12px;font-weight:600;color:var(--text-sub)}
.form-input{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:10px;padding:10px 14px;color:#fff;font-size:14px;outline:none}
.form-input:focus{border-color:rgba(255,255,255,0.5)}
.action-btn{background:#ffffff;color:#121212;border:0;border-radius:10px;padding:12px;font-size:13px;font-weight:700;cursor:pointer;outline:none;margin-top:16px}
.action-btn.secondary{background:rgba(255,255,255,0.15);color:#fff;margin-top:8px}
.action-btn.danger{background:rgba(239,68,68,0.25);color:#fca5a5;border:1px solid rgba(239,68,68,0.4)}
.search-results{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto;margin-top:10px}
.search-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,0.06);cursor:pointer;text-align:left}
.search-item:hover{background:rgba(255,255,255,0.12)}
.search-poster{width:36px;height:50px;object-fit:cover;border-radius:4px;background:#27272a;flex-shrink:0}
.search-info{display:flex;flex-direction:column;min-width:0;flex:1}
.search-title{font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-meta{font-size:11px;color:var(--text-sub)}
body.hud-off .top-bar,body.hud-off .center-ctrls,body.hud-off .bottom-bar{opacity:0;pointer-events:none}
body.locked .top-bar,body.locked .center-ctrls,body.locked .bottom-bar{display:none!important}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.light.min.js"></script>
</head>
<body>
<div class="app" id="appRoot">
  <div class="stage" id="stage">
    <video id="vid" playsinline preload="auto"></video>
    <div class="toast" id="toast"></div>
    <div class="badge" id="badge"></div>
    <button type="button" class="lock-unlock-btn" id="unlockBtn">Разблокировать экран</button>

    <div class="top-bar" id="topBar">
      <div class="top-row">
        <div class="top-left">
          <button type="button" class="icon-btn" id="searchBtn" aria-label="Поиск">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          </button>
          <button type="button" class="title-btn" id="titleLbl">Загрузка...</button>
        </div>
        <div class="top-right">
          <button type="button" class="pill-btn" id="roomBtn">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span id="roomBtnLbl">Комната</span>
          </button>
          <button type="button" class="pill-btn" id="speedBtn"><span id="speedLbl">1x</span><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
          <button type="button" class="pill-btn" id="qualityBtn"><span id="qualityLbl">720p</span><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
          <button type="button" class="icon-btn" id="lockBtn" aria-label="Заблокировать экран">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>
          </button>
        </div>
      </div>
      <div class="sub-bar" id="subBar">
        <button type="button" class="pill-btn" id="epPickerBtn"><span id="epCurLbl">1 серия</span><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
        <button type="button" class="pill-btn" id="voicePickerBtn"><span id="voiceCurLbl" style="max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Озвучка</span><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
      </div>
    </div>

    <div class="center-ctrls" id="centerCtrls">
      <button type="button" class="c-btn" id="cPrevBtn" aria-label="Предыдущая серия"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
      <button type="button" class="c-btn c-play" id="cPlayBtn" aria-label="Воспроизвести или пауза"><svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <button type="button" class="c-btn" id="cNextBtn" aria-label="Следующая серия"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
    </div>

    <div class="bottom-bar" id="bottomBar">
      <div class="timeline-box" id="timelineBox">
        <div class="timeline-track"></div>
        <div class="timeline-buffer" id="timelineBuffer"></div>
        <div class="timeline-played" id="timelinePlayed"></div>
        <input id="seek" class="timeline-seek" type="range" aria-label="Позиция воспроизведения" min="0" max="1000" step="1" value="0">
      </div>
      <div class="b-row">
        <span class="time-lbl" id="timeLbl">00:00 / 00:00</span>
        <div class="b-actions">
          <button type="button" class="skip-btn" id="skip85Btn" title="Пропуск опенинга">+85с</button>
          <button type="button" class="pip-btn" id="pipBtn" aria-label="Картинка в картинке">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><rect x="12" y="11" width="7" height="6" rx="1" fill="currentColor" stroke="none"/></svg>
          </button>
          <button type="button" class="fs-btn" id="fsBtn" aria-label="Полный экран">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 2 2h3"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="dropdown" id="speedDrop"></div>
    <div class="dropdown" id="qualityDrop"></div>

    <div class="modal-bg centered" id="searchModal">
      <div class="modal-sheet">
        <div class="modal-hdr">
          <span class="modal-title">Поиск тайтла или ссылка Kodik</span>
          <button type="button" class="pill-btn" id="closeSearchBtn" aria-label="Закрыть"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        </div>
        <div class="form-group">
          <input class="form-input" id="searchKeywordInput" type="text" placeholder="Название, ссылка Kodik или shiki:2472">
        </div>
        <div class="search-results" id="searchResultsContainer"></div>
      </div>
    </div>

    <div class="modal-bg" id="epModal">
      <div class="modal-sheet">
        <div class="modal-hdr">
          <span class="modal-title">Выберите серию</span>
          <button type="button" class="pill-btn" id="epCloseBtn" aria-label="Закрыть"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        </div>
        <div class="modal-grid" id="epGrid"></div>
      </div>
    </div>

    <div class="modal-bg" id="voiceModal">
      <div class="modal-sheet">
        <div class="modal-hdr">
          <span class="modal-title">Выберите озвучку</span>
          <button type="button" class="pill-btn" id="voiceCloseBtn" aria-label="Закрыть"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        </div>
        <div class="modal-grid" style="grid-template-columns:1fr;max-height:45vh" id="voiceList"></div>
      </div>
    </div>

    <div class="modal-bg centered" id="roomModal">
      <div class="modal-sheet">
        <div class="modal-hdr">
          <span class="modal-title" id="roomModalHeader">Совместный просмотр</span>
          <button type="button" class="pill-btn" id="closeRoomModalBtn" aria-label="Закрыть"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        </div>
        <div id="roomCreateView">
          <div class="form-group">
            <label class="form-label" for="roomNickInput">Ваше имя:</label>
            <input class="form-input" id="roomNickInput" type="text" placeholder="Введите никнейм" maxlength="24">
          </div>
          <button type="button" class="action-btn" id="createRoomBtn">Создать новую комнату</button>
          <div class="form-group" style="margin-top:14px">
            <label class="form-label" for="joinRoomInput">Или войти по ID комнаты:</label>
            <input class="form-input" id="joinRoomInput" type="text" placeholder="room-xxxxxx">
          </div>
          <button type="button" class="action-btn secondary" id="joinRoomBtn">Войти в комнату</button>
        </div>
        <div id="roomManageView" style="display:none">
          <div class="form-group">
            <label class="form-label">Ссылка для друзей:</label>
            <input class="form-input" id="roomLinkInput" readonly>
          </div>
          <button type="button" class="action-btn secondary" id="copyLinkBtn">Скопировать ссылку</button>
          <div class="form-label" style="margin-top:12px">Участники онлайн:</div>
          <div id="roomUsersBox" style="display:flex;flex-direction:column;gap:6px;max-height:160px;overflow-y:auto;margin-top:6px"></div>
          <button type="button" class="action-btn danger" id="leaveRoomBtn">Выйти из комнаты</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  var PLAY_SVG='<path d="M8 5v14l11-7z"/>';
  var PAUSE_SVG='<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
  var LOCK_OPEN_SVG='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>';
  var LOCK_CLOSED_SVG='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';

  var vid=document.getElementById('vid'),toast=document.getElementById('toast'),badge=document.getElementById('badge'),stage=document.getElementById('stage');
  var titleLbl=document.getElementById('titleLbl'),epCurLbl=document.getElementById('epCurLbl'),voiceCurLbl=document.getElementById('voiceCurLbl');
  var epPickerBtn=document.getElementById('epPickerBtn'),voicePickerBtn=document.getElementById('voicePickerBtn');
  var speedBtn=document.getElementById('speedBtn'),speedLbl=document.getElementById('speedLbl'),speedDrop=document.getElementById('speedDrop');
  var qualityBtn=document.getElementById('qualityBtn'),qualityLbl=document.getElementById('qualityLbl'),qualityDrop=document.getElementById('qualityDrop');
  var lockBtn=document.getElementById('lockBtn'),unlockBtn=document.getElementById('unlockBtn');
  var cPrevBtn=document.getElementById('cPrevBtn'),cPlayBtn=document.getElementById('cPlayBtn'),cNextBtn=document.getElementById('cNextBtn'),playIcon=document.getElementById('playIcon');
  var seek=document.getElementById('seek'),timelineBuffer=document.getElementById('timelineBuffer'),timelinePlayed=document.getElementById('timelinePlayed');
  var timeLbl=document.getElementById('timeLbl'),skip85Btn=document.getElementById('skip85Btn'),pipBtn=document.getElementById('pipBtn'),fsBtn=document.getElementById('fsBtn');
  var searchBtn=document.getElementById('searchBtn'),searchModal=document.getElementById('searchModal'),closeSearchBtn=document.getElementById('closeSearchBtn'),searchKeywordInput=document.getElementById('searchKeywordInput'),searchResultsContainer=document.getElementById('searchResultsContainer');
  var epModal=document.getElementById('epModal'),epCloseBtn=document.getElementById('epCloseBtn'),epGrid=document.getElementById('epGrid');
  var voiceModal=document.getElementById('voiceModal'),voiceCloseBtn=document.getElementById('voiceCloseBtn'),voiceList=document.getElementById('voiceList');
  var roomBtn=document.getElementById('roomBtn'),roomBtnLbl=document.getElementById('roomBtnLbl'),roomModal=document.getElementById('roomModal'),closeRoomModalBtn=document.getElementById('closeRoomModalBtn'),roomModalHeader=document.getElementById('roomModalHeader');
  var roomCreateView=document.getElementById('roomCreateView'),roomManageView=document.getElementById('roomManageView'),roomNickInput=document.getElementById('roomNickInput'),createRoomBtn=document.getElementById('createRoomBtn'),joinRoomInput=document.getElementById('joinRoomInput'),joinRoomBtn=document.getElementById('joinRoomBtn');
  var roomLinkInput=document.getElementById('roomLinkInput'),copyLinkBtn=document.getElementById('copyLinkBtn'),roomUsersBox=document.getElementById('roomUsersBox'),leaveRoomBtn=document.getElementById('leaveRoomBtn');

  var hls=null,ctxData=null,vIdx=0,eIdx=0,currentSrc='',cleanTitle='',rate=1.0,isLocked=false,hudTimer=null,badgeTimer=null,isSeeking=false;
  var SPEEDS=[0.25,0.5,0.75,1.0,1.25,1.5,1.75,2.0,2.5,3.0,4.0];
  var roomState={active:false,id:'',role:'viewer',users:[],ws:null,myId:''};

  function sanitizeTitle(raw){
    if(!raw)return '';
    var str=String(raw).trim();
    str=str.replace(/\[[^\]]*?(сери|эп|сезон|из|озвуч|sub|voice|дубл|закадр|anilib|anidub)[^\]]*?\]/gi,'');
    str=str.replace(/\([^)]*?(сери|эп|сезон|из|озвуч|sub|voice|дубл|закадр|тв-\d+|фильм|ova|ona)[^)]*?\)/gi,'');
    if(str.indexOf('/')!==-1){
      var parts=str.split('/');
      if(parts[0].trim().length>=2)str=parts[0].trim();
    }
    str=str.replace(/\s+(?:\d+\s+сезон|сезон\s+\d+)\s*$/i,'');
    str=str.replace(/[()[\]{}]/g,' ').replace(/\s+/g,' ').trim();
    return str||raw.trim();
  }

  function fmtTime(sec){
    if(!sec||isNaN(sec)||sec<0)return '00:00';
    var t=Math.floor(sec),h=Math.floor(t/3600),m=Math.floor((t%3600)/60),s=t%60;
    var mm=m<10?'0'+m:String(m),ss=s<10?'0'+s:String(s);
    return h>0?(h+':'+mm+':'+ss):(mm+':'+ss);
  }

  function flash(t){
    badge.textContent=t;badge.style.display='block';
    if(badgeTimer)clearTimeout(badgeTimer);
    badgeTimer=setTimeout(function(){badge.style.display='none';},1000);
  }

  function wakeHud(){
    if(isLocked)return;
    document.body.classList.remove('hud-off');
    if(hudTimer)clearTimeout(hudTimer);
    if(!vid.paused){
      hudTimer=setTimeout(function(){
        if(!vid.paused){
          document.body.classList.add('hud-off');
          speedDrop.style.display='none';qualityDrop.style.display='none';
        }
      },3200);
    }
  }

  function applyRate(val){
    rate=Math.max(0.25,Math.min(4.0,parseFloat(val)||1.0));
    try{
      if('preservesPitch' in vid)vid.preservesPitch=true;
      if('webkitPreservesPitch' in vid)vid.webkitPreservesPitch=true;
      vid.defaultPlaybackRate=rate;
      vid.playbackRate=rate;
    }catch(e){}
    speedLbl.textContent=rate+'x';
    try{localStorage.setItem('kodik_rate',String(rate));}catch(e){}
  }

  function buildSpeedDrop(){
    speedDrop.innerHTML='';
    SPEEDS.forEach(function(s){
      var b=document.createElement('button');b.type='button';b.className='drop-item'+(Math.abs(s-rate)<0.02?' active':'');b.textContent=s+'x';
      b.onclick=function(e){
        e.stopPropagation();applyRate(s);speedDrop.style.display='none';flash(s+'x');
        if(roomState.active&&(roomState.role==='host'||roomState.role==='admin'))sendRoomAction('RATE',{rate:s});
        wakeHud();
      };
      speedDrop.appendChild(b);
    });
  }

  speedBtn.onclick=function(e){
    e.stopPropagation();qualityDrop.style.display='none';
    buildSpeedDrop();
    var r=speedBtn.getBoundingClientRect();speedDrop.style.top=(r.bottom+6)+'px';speedDrop.style.right=(window.innerWidth-r.right)+'px';
    speedDrop.style.display=speedDrop.style.display==='flex'?'none':'flex';
  };

  qualityBtn.onclick=function(e){
    e.stopPropagation();speedDrop.style.display='none';
    var r=qualityBtn.getBoundingClientRect();qualityDrop.style.top=(r.bottom+6)+'px';qualityDrop.style.right=(window.innerWidth-r.right)+'px';
    qualityDrop.style.display=qualityDrop.style.display==='flex'?'none':'flex';
  };

  function updateTimeline(){
    var cur=vid.currentTime||0,dur=vid.duration||0;
    timeLbl.textContent=fmtTime(cur)+' / '+fmtTime(dur);
    if(dur>0){
      var playedPct=Math.max(0,Math.min(100,(cur/dur)*100));
      timelinePlayed.style.width=playedPct+'%';
      if(!isSeeking)seek.value=String(Math.round((cur/dur)*1000));
      if(vid.buffered.length>0){
        var bEnd=vid.buffered.end(vid.buffered.length-1);
        var bPct=Math.max(0,Math.min(100,(bEnd/dur)*100));
        timelineBuffer.style.width=bPct+'%';
      }
    }
  }

  seek.oninput=function(){
    isSeeking=true;
    var dur=vid.duration||0;
    if(dur>0){
      var cur=(parseFloat(seek.value)/1000)*dur;
      timeLbl.textContent=fmtTime(cur)+' / '+fmtTime(dur);
      timelinePlayed.style.width=((cur/dur)*100)+'%';
    }
  };

  seek.onchange=function(){
    isSeeking=false;
    var dur=vid.duration||0;
    if(dur>0){
      var cur=(parseFloat(seek.value)/1000)*dur;
      vid.currentTime=cur;
      if(roomState.active&&(roomState.role==='host'||roomState.role==='admin'))sendRoomAction('SEEK',{time:cur});
    }
    wakeHud();
  };

  function togglePlay(userTriggered){
    if(userTriggered&&roomState.active&&roomState.role==='viewer'){
      flash('Только хост или админ управляет просмотром');return;
    }
    if(vid.paused){
      vid.play().then(function(){
        playIcon.innerHTML=PAUSE_SVG;
        if(userTriggered&&roomState.active&&(roomState.role==='host'||roomState.role==='admin'))sendRoomAction('PLAY',{time:vid.currentTime});
      }).catch(function(){});
    }else{
      vid.pause();
      playIcon.innerHTML=PLAY_SVG;
      if(userTriggered&&roomState.active&&(roomState.role==='host'||roomState.role==='admin'))sendRoomAction('PAUSE',{time:vid.currentTime});
    }
    wakeHud();
  }

  cPlayBtn.onclick=function(e){e.stopPropagation();togglePlay(true);};
  vid.onclick=function(e){e.stopPropagation();togglePlay(true);};

  skip85Btn.onclick=function(e){
    e.stopPropagation();
    var cur=vid.currentTime||0,dur=vid.duration||0;
    var target=Math.min(dur,cur+85);
    vid.currentTime=target;
    flash('+85с');
    if(roomState.active&&(roomState.role==='host'||roomState.role==='admin'))sendRoomAction('SEEK',{time:target});
    wakeHud();
  };

  pipBtn.onclick=function(e){
    e.stopPropagation();
    if(document.pictureInPictureElement)document.exitPictureInPicture().catch(function(){});
    else if(vid.requestPictureInPicture)vid.requestPictureInPicture().catch(function(){});
  };

  fsBtn.onclick=function(e){
    e.stopPropagation();
    if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(function(){});
    else document.exitFullscreen().catch(function(){});
  };

  lockBtn.onclick=function(e){
    e.stopPropagation();
    isLocked=true;document.body.classList.add('locked');
    speedDrop.style.display='none';qualityDrop.style.display='none';
    flash('Экран заблокирован');
  };

  stage.onclick=function(){
    if(isLocked){
      unlockBtn.style.display='inline-flex';
      setTimeout(function(){unlockBtn.style.display='none';},2200);
      return;
    }
    if(document.body.classList.contains('hud-off'))wakeHud();
    else document.body.classList.add('hud-off');
  };

  unlockBtn.onclick=function(e){
    e.stopPropagation();
    isLocked=false;document.body.classList.remove('locked');
    unlockBtn.style.display='none';flash('Экран разблокирован');wakeHud();
  };

  function mountStream(url,startFrom){
    if(hls){try{hls.destroy();}catch(e){}hls=null;}
    vid.pause();
    var isM3u8=url.indexOf('.m3u8')!==-1||url.indexOf('/api/hls-proxy')!==-1;
    if(isM3u8&&window.Hls&&window.Hls.isSupported()){
      hls=new window.Hls({enableWorker:true,lowLatencyMode:false});
      hls.loadSource(url);
      hls.attachMedia(vid);
      hls.on(window.Hls.Events.MANIFEST_PARSED,function(_,data){
        if(data.levels&&data.levels.length>0){
          qualityDrop.innerHTML='';
          data.levels.forEach(function(lvl,idx){
            var b=document.createElement('button');b.type='button';b.className='drop-item';b.textContent=lvl.height+'p';
            b.onclick=function(e){
              e.stopPropagation();hls.currentLevel=idx;qualityLbl.textContent=lvl.height+'p';qualityDrop.style.display='none';
            };
            qualityDrop.appendChild(b);
          });
        }
        applyRate(rate);
        if(startFrom>1)vid.currentTime=startFrom;
        vid.play().then(function(){playIcon.innerHTML=PAUSE_SVG;}).catch(function(){playIcon.innerHTML=PLAY_SVG;});
      });
    }else{
      vid.src=url;vid.load();applyRate(rate);
      if(startFrom>1)vid.currentTime=startFrom;
      vid.play().then(function(){playIcon.innerHTML=PAUSE_SVG;}).catch(function(){playIcon.innerHTML=PLAY_SVG;});
    }
  }

  function loadEpisode(targetEIdx,startFrom,userTriggered){
    if(!ctxData||!ctxData.variants[vIdx])return;
    var eps=ctxData.variants[vIdx].episodes||[];
    if(targetEIdx<0||targetEIdx>=eps.length)return;
    eIdx=targetEIdx;
    epCurLbl.textContent=eps[eIdx].label;
    var epLink=eps[eIdx].link;
    fetch('/api/stream?link='+encodeURIComponent(epLink)).then(function(r){return r.json();}).then(function(d){
      var streamUrl=(d.proxyStreams&&d.proxyStreams['720'])||(d.streams&&d.streams['720'])||epLink;
      currentSrc=streamUrl;
      mountStream(streamUrl,startFrom||0);
      if(userTriggered&&roomState.active&&(roomState.role==='host'||roomState.role==='admin')){
        sendRoomAction('CHANGE_EP',{eIdx:eIdx,vIdx:vIdx,src:streamUrl});
      }
    }).catch(function(){
      currentSrc=epLink;mountStream(epLink,startFrom||0);
    });
  }

  cPrevBtn.onclick=function(e){e.stopPropagation();if(eIdx>0)loadEpisode(eIdx-1,0,true);};
  cNextBtn.onclick=function(e){e.stopPropagation();loadEpisode(eIdx+1,0,true);};

  function openEpisodeModal(){
    if(!ctxData||!ctxData.variants[vIdx])return;
    epGrid.innerHTML='';
    (ctxData.variants[vIdx].episodes||[]).forEach(function(ep,i){
      var b=document.createElement('button');b.type='button';b.className='ep-tile'+(i===eIdx?' active':'');b.textContent=ep.e;
      b.onclick=function(e){
        e.stopPropagation();epModal.style.display='none';loadEpisode(i,0,true);
      };
      epGrid.appendChild(b);
    });
    epModal.style.display='flex';
  }

  function openVoiceModal(){
    if(!ctxData)return;
    voiceList.innerHTML='';
    (ctxData.variants||[]).forEach(function(v,i){
      var b=document.createElement('button');b.type='button';b.className='ep-tile'+(i===vIdx?' active':'');b.style.textAlign='left';b.style.padding='10px 14px';
      b.textContent=v.label;
      b.onclick=function(e){
        e.stopPropagation();voiceModal.style.display='none';
        if(i===vIdx)return;
        var oldEp=ctxData.variants[vIdx]&&ctxData.variants[vIdx].episodes[eIdx];
        vIdx=i;
        voiceCurLbl.textContent=ctxData.variants[vIdx].shortLabel||'Озвучка';
        var newEps=ctxData.variants[vIdx].episodes||[];
        var targetE=0;
        if(oldEp){
          for(var k=0;k<newEps.length;k++){if(newEps[k].e===oldEp.e){targetE=k;break;}}
        }
        var savedSec=vid.currentTime||0;
        loadEpisode(targetE,savedSec,true);
      };
      voiceList.appendChild(b);
    });
    voiceModal.style.display='flex';
  }

  epPickerBtn.onclick=function(e){e.stopPropagation();openEpisodeModal();};
  voicePickerBtn.onclick=function(e){e.stopPropagation();openVoiceModal();};
  epCloseBtn.onclick=function(){epModal.style.display='none';};
  voiceCloseBtn.onclick=function(){voiceModal.style.display='none';};

  function applyContext(d){
    ctxData=d;
    cleanTitle=sanitizeTitle(d.title);
    titleLbl.textContent=cleanTitle;
    document.title=cleanTitle+' — Kodik Player';
    vIdx=0;eIdx=0;
    voiceCurLbl.textContent=d.variants[0]?d.variants[0].shortLabel:'Озвучка';
    loadEpisode(0,0,false);
  }

  function loadContextByQuery(q){
    fetch('/api/context?q='+encodeURIComponent(q)).then(function(r){return r.json();}).then(function(d){
      if(d.ok)applyContext(d);
    }).catch(function(){});
  }

  searchBtn.onclick=function(e){e.stopPropagation();searchModal.style.display='flex';searchKeywordInput.focus();};
  titleLbl.onclick=function(e){e.stopPropagation();searchModal.style.display='flex';searchKeywordInput.focus();};
  closeSearchBtn.onclick=function(){searchModal.style.display='none';};

  var searchTimer=null;
  searchKeywordInput.oninput=function(){
    var q=searchKeywordInput.value.trim();
    if(searchTimer)clearTimeout(searchTimer);
    if(q.length<2){searchResultsContainer.innerHTML='';return;}
    searchTimer=setTimeout(function(){
      fetch('/api/search?q='+encodeURIComponent(q)).then(function(r){return r.json();}).then(function(d){
        searchResultsContainer.innerHTML='';
        if(d.ok&&Array.isArray(d.items)){
          d.items.forEach(function(item){
            var row=document.createElement('div');row.className='search-item';
            var posterImg=document.createElement('img');posterImg.className='search-poster';
            if(item.poster)posterImg.src=item.poster.indexOf('//')===0?('https:'+item.poster):item.poster;
            row.appendChild(posterImg);
            var info=document.createElement('div');info.className='search-info';
            var t=document.createElement('div');t.className='search-title';t.textContent=item.title;info.appendChild(t);
            var m=document.createElement('div');m.className='search-meta';m.textContent=(item.year?item.year+' · ':'')+'Озвучек: '+item.variantsCount;info.appendChild(m);
            row.appendChild(info);
            row.onclick=function(){
              searchModal.style.display='none';
              fetch('/api/context?gk='+encodeURIComponent(item.groupKey)).then(function(r){return r.json();}).then(function(cd){
                if(cd.ok)applyContext(cd);
              });
            };
            searchResultsContainer.appendChild(row);
          });
        }
      });
    },300);
  };

  function sendRoomAction(action,data){
    if(roomState.ws&&roomState.ws.readyState===WebSocket.OPEN){
      var pkt=Object.assign({type:'SYNC_ACTION',action:action},data);
      roomState.ws.send(JSON.stringify(pkt));
    }
  }

  function initWatchParty(packet){
    if(roomState.ws){roomState.ws.close();roomState.ws=null;}
    var proto=window.location.protocol==='https:'?'wss:':'ws:';
    var ws=new WebSocket(proto+'//'+window.location.host+'/ws');
    roomState.ws=ws;
    ws.onopen=function(){ws.send(JSON.stringify(packet));};
    ws.onmessage=function(e){
      try{
        var pkt=JSON.parse(e.data);
        if(pkt.type==='ROOM_CREATED'||pkt.type==='JOIN_SUCCESS'){
          roomState.active=true;roomState.id=pkt.roomId;roomState.role=pkt.role;roomState.myId=pkt.userId;roomState.users=pkt.users||[];
          roomBtn.classList.add('room-active');
          roomBtnLbl.textContent='Комната ('+roomState.users.length+')';
          roomCreateView.style.display='none';
          roomManageView.style.display='block';
          roomLinkInput.value=window.location.origin+'?room='+pkt.roomId;
          roomModalHeader.textContent='Комната '+pkt.roomId;
          renderRoomUsers();
          flash(pkt.role==='host'?'Комната создана':'Подключено к комнате');
        }else if(pkt.type==='JOIN_ERROR'){
          flash(pkt.reason||'Ошибка подключения');
        }else if(pkt.type==='USER_JOINED'||pkt.type==='USER_LEFT'||pkt.type==='USER_PROMOTED'||pkt.type==='USER_KICKED'){
          roomState.users=pkt.users||[];
          roomBtnLbl.textContent='Комната ('+roomState.users.length+')';
          renderRoomUsers();
        }else if(pkt.type==='PLAY'){
          if(pkt.time!==undefined&&Math.abs((vid.currentTime||0)-pkt.time)>1.5)vid.currentTime=pkt.time;
          vid.play().then(function(){playIcon.innerHTML=PAUSE_SVG;}).catch(function(){});
        }else if(pkt.type==='PAUSE'){
          if(pkt.time!==undefined)vid.currentTime=pkt.time;
          vid.pause();playIcon.innerHTML=PLAY_SVG;
        }else if(pkt.type==='SEEK'&&pkt.time!==undefined){
          vid.currentTime=pkt.time;
        }else if(pkt.type==='RATE'&&pkt.rate!==undefined){
          applyRate(pkt.rate);flash(pkt.rate+'x');
        }else if(pkt.type==='CHANGE_EP'){
          if(pkt.eIdx!==undefined)eIdx=pkt.eIdx;
          if(pkt.vIdx!==undefined)vIdx=pkt.vIdx;
          if(pkt.src)mountStream(pkt.src,0);
        }else if(pkt.type==='HEARTBEAT'&&roomState.role==='viewer'&&pkt.time!==undefined){
          if(Math.abs((vid.currentTime||0)-pkt.time)>1.8)vid.currentTime=pkt.time;
        }
      }catch(err){}
    };
  }

  function renderRoomUsers(){
    roomUsersBox.innerHTML='';
    (roomState.users||[]).forEach(function(u){
      var row=document.createElement('div');row.style.display='flex';row.style.alignItems='center';row.style.justifyContent='space-between';
      row.style.padding='6px 8px';row.style.borderRadius='6px';row.style.background='rgba(255,255,255,0.06)';row.style.fontSize='12px';
      var nm=document.createElement('span');nm.textContent=u.name+(u.id===roomState.myId?' (Вы)':'')+' · '+(u.role==='host'?'Хост':(u.role==='admin'?'Админ':'Зритель'));
      row.appendChild(nm);
      roomUsersBox.appendChild(row);
    });
  }

  roomBtn.onclick=function(e){
    e.stopPropagation();
    roomModal.style.display='flex';
    if(roomState.active){roomCreateView.style.display='none';roomManageView.style.display='block';}
    else{roomCreateView.style.display='block';roomManageView.style.display='none';}
  };

  closeRoomModalBtn.onclick=function(){roomModal.style.display='none';};

  createRoomBtn.onclick=function(){
    var nick=roomNickInput.value.trim()||'Хост';
    roomModal.style.display='none';
    initWatchParty({type:'CREATE_ROOM',name:nick,src:currentSrc,title:cleanTitle,time:vid.currentTime||0,paused:vid.paused,rate:rate});
  };

  joinRoomBtn.onclick=function(){
    var targetId=joinRoomInput.value.trim();
    var nick=roomNickInput.value.trim()||'Гость';
    if(!targetId){flash('Укажите ID комнаты');return;}
    roomModal.style.display='none';
    initWatchParty({type:'JOIN_ROOM',roomId:targetId,name:nick});
  };

  copyLinkBtn.onclick=function(){
    if(navigator.clipboard)navigator.clipboard.writeText(roomLinkInput.value).then(function(){flash('Ссылка скопирована');});
  };

  leaveRoomBtn.onclick=function(){
    if(roomState.ws){roomState.ws.close();roomState.ws=null;}
    roomState.active=false;roomBtn.classList.remove('room-active');roomBtnLbl.textContent='Комната';
    roomModal.style.display='none';flash('Вы вышли из комнаты');
  };

  setInterval(function(){
    if(roomState.active&&roomState.role==='host'){
      sendRoomAction('HEARTBEAT',{time:vid.currentTime||0,paused:vid.paused});
    }
  },3000);

  vid.ontimeupdate=updateTimeline;
  vid.onprogress=updateTimeline;
  vid.onplay=function(){playIcon.innerHTML=PAUSE_SVG;wakeHud();};
  vid.onpause=function(){playIcon.innerHTML=PLAY_SVG;document.body.classList.remove('hud-off');};
  vid.onended=function(){if(ctxData&&eIdx+1<(ctxData.variants[vIdx].episodes||[]).length)loadEpisode(eIdx+1,0,true);};

  window.onkeydown=function(e){
    if(isLocked)return;
    var tag=e.target&&e.target.tagName;
    if(tag==='INPUT')return;
    if(e.code==='Space'){e.preventDefault();togglePlay(true);}
    else if(e.code==='ArrowRight'){e.preventDefault();vid.currentTime=(vid.currentTime||0)+10;flash('+10с');}
    else if(e.code==='ArrowLeft'){e.preventDefault();vid.currentTime=Math.max(0,(vid.currentTime||0)-10);flash('-10с');}
    else if(e.key===']'){e.preventDefault();applyRate(rate+0.25);flash(rate+'x');}
    else if(e.key==='['){e.preventDefault();applyRate(rate-0.25);flash(rate+'x');}
  };

  var qParams=new URLSearchParams(window.location.search);
  var initialRoom=qParams.get('room');
  if(initialRoom){
    joinRoomInput.value=initialRoom;
    roomModal.style.display='flex';
  }

  loadContextByQuery('Клинок, рассекающий демонов');
  wakeHud();
})();
</script>
</body>
</html>
