<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="referrer" content="origin">
  <title>Kodik Custom Speed Player</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      color: white;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      user-select: none;
    }
    iframe {
      border: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .msg {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
      font-size: 15px;
    }
    .hud {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      pointer-events: none;
    }
    .pill, .panel {
      pointer-events: auto;
      background: rgba(18, 18, 22, 0.86);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(8px);
      border-radius: 10px;
      color: white;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }
    .pill {
      padding: 6px 11px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .panel {
      display: none;
      padding: 10px;
      width: 236px;
      box-sizing: border-box;
    }
    .panel.open {
      display: block;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
      margin-bottom: 8px;
    }
    .row:last-child {
      margin-bottom: 0;
    }
    .btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: white;
      border-radius: 7px;
      padding: 5px 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      flex: 1;
      text-align: center;
    }
    .btn:active {
      background: rgba(99, 102, 241, 0.65);
    }
    .inp {
      width: 64px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: white;
      border-radius: 7px;
      padding: 5px 6px;
      font-size: 13px;
      text-align: center;
    }
    .hint {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.68);
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var raw = (params.get("src") || params.get("url") || "").trim();
      if (raw.indexOf("//") === 0) {
        raw = "https:" + raw;
      }
      var target = null;
      try {
        var parsed = new URL(raw);
        if (parsed.protocol === "https:" || parsed.protocol === "http:") {
          target = parsed.href;
        }
      } catch (e) {}

      if (!target) {
        var box = document.createElement("div");
        box.className = "msg";
        box.textContent = "Передайте ссылку плеера в параметре ?src=";
        document.body.appendChild(box);
        return;
      }

      var savedRate = parseFloat(localStorage.getItem("kodik_iframe_speed") || params.get("speed") || "1");
      if (isNaN(savedRate) || savedRate < 0.25 || savedRate > 2) {
        savedRate = 1;
      }

      var frame = document.createElement("iframe");
      frame.setAttribute("allowfullscreen", "true");
      frame.setAttribute("webkitallowfullscreen", "true");
      frame.setAttribute("mozallowfullscreen", "true");
      frame.setAttribute("allow", "autoplay; fullscreen; picture-in-picture; encrypted-media");
      frame.src = target;
      document.body.appendChild(frame);

      var hud = document.createElement("div");
      hud.className = "hud";

      var toggleBtn = document.createElement("button");
      toggleBtn.className = "pill";

      var panel = document.createElement("div");
      panel.className = "panel";

      var stepRow = document.createElement("div");
      stepRow.className = "row";

      var minusBig = document.createElement("button");
      minusBig.className = "btn";
      minusBig.textContent = "-0.25";

      var minusSmall = document.createElement("button");
      minusSmall.className = "btn";
      minusSmall.textContent = "-0.05";

      var speedInput = document.createElement("input");
      speedInput.className = "inp";
      speedInput.type = "number";
      speedInput.step = "0.05";
      speedInput.min = "0.25";
      speedInput.max = "2";

      var plusSmall = document.createElement("button");
      plusSmall.className = "btn";
      plusSmall.textContent = "+0.05";

      var plusBig = document.createElement("button");
      plusBig.className = "btn";
      plusBig.textContent = "+0.25";

      stepRow.appendChild(minusBig);
      stepRow.appendChild(minusSmall);
      stepRow.appendChild(speedInput);
      stepRow.appendChild(plusSmall);
      stepRow.appendChild(plusBig);

      var presetRow = document.createElement("div");
      presetRow.className = "row";
      [1, 1.25, 1.5, 1.75, 2].forEach(function (val) {
        var b = document.createElement("button");
        b.className = "btn";
        b.textContent = val + "x";
        b.onclick = function () { setSpeed(val); };
        presetRow.appendChild(b);
      });

      var hint = document.createElement("div");
      hint.className = "hint";
      hint.textContent = "Скорость 0.25x–2.00x удерживается при смене серии и озвучки. Для >2x откройте плеер внутри плагина.";

      panel.appendChild(stepRow);
      panel.appendChild(presetRow);
      panel.appendChild(hint);
      hud.appendChild(toggleBtn);
      hud.appendChild(panel);
      document.body.appendChild(hud);

      function postSpeed() {
        try {
          if (frame.contentWindow) {
            frame.contentWindow.postMessage({
              key: "kodik_player_api",
              value: { method: "speed", speed: savedRate }
            }, "*");
          }
        } catch (e) {}
      }

      function renderSpeed() {
        var formatted = savedRate.toFixed(2).replace(/\.00$/, ".0");
        toggleBtn.textContent = "⚡ " + formatted + "x";
        speedInput.value = savedRate.toFixed(2);
      }

      function setSpeed(nextVal) {
        var num = Math.round(parseFloat(nextVal) * 100) / 100;
        if (isNaN(num)) return;
        if (num < 0.25) num = 0.25;
        if (num > 2) num = 2;
        savedRate = num;
        try { localStorage.setItem("kodik_iframe_speed", String(savedRate)); } catch (e) {}
        renderSpeed();
        postSpeed();
      }

      toggleBtn.onclick = function () {
        panel.classList.toggle("open");
      };
      minusBig.onclick = function () { setSpeed(savedRate - 0.25); };
      minusSmall.onclick = function () { setSpeed(savedRate - 0.05); };
      plusSmall.onclick = function () { setSpeed(savedRate + 0.05); };
      plusBig.onclick = function () { setSpeed(savedRate + 0.25); };
      speedInput.onchange = function () { setSpeed(speedInput.value); };

      window.addEventListener("message", function (ev) {
        if (!ev || !ev.data || !ev.data.key) return;
        var k = String(ev.data.key);
        if (
          k === "kodik_player_video_started" ||
          k === "kodik_player_current_episode" ||
          k === "kodik_player_duration_update" ||
          k === "kodik_player_play"
        ) {
          postSpeed();
          setTimeout(postSpeed, 350);
        }
      });

      renderSpeed();
      setInterval(function () {
        if (savedRate !== 1) postSpeed();
      }, 2500);
    })();
  </script>
</body>
</html>
