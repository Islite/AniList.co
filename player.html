<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Kodik Player &amp; Watch Party</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--sheet-bg:rgba(24,24,27,0.96);--panel-bg:rgba(28,28,30,0.92);--text-main:#ffffff;--text-sub:#a1a1aa;--tile-bg:rgba(255,255,255,0.22);--accent-green:#10b981;--accent-red:#ef4444;--accent-blue:#3b82f6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;color:var(--text-main);overflow:hidden;font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;user-select:none}
.app{position:relative;display:flex;flex-direction:column;width:100%;height:100%;background:#000}
.stage{position:relative;flex:1;min-height:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
video,iframe{position:absolute;inset:0;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;background:#000;border:0;outline:none}
iframe{pointer-events:none;z-index:1}
.surface-curtain{position:absolute;inset:0;background:#000;z-index:2;pointer-events:none;display:none}
.surface-mask-top{position:absolute;top:0;left:0;right:0;height:46px;background:#000;z-index:3;pointer-events:none;display:none}
.surface-mask-bottom{position:absolute;bottom:0;left:0;right:0;height:46px;background:#000;z-index:3;pointer-events:none;display:none}
body.mode-surface.surface-paused .surface-mask-top,body.mode-surface.surface-paused .surface-mask-bottom{display:block}
.top-bar{position:absolute;top:0;left:0;right:0;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top, 0px)) 14px 10px;background:linear-gradient(180deg,#000000 0%,rgba(0,0,0,0.96) 54%,rgba(0,0,0,0.68) 82%,transparent 100%);z-index:30;transition:opacity .25s ease}
.top-row{display:flex;align-items:center;justify-content:space-between;width:100%;gap:8px}
.top-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.top-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.title-btn{background:transparent;border:0;padding:0;font-size:14px;font-weight:700;color:var(--text-main);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:32px;cursor:pointer;text-align:left;font-family:inherit}
.sub-bar{display:flex;align-items:center;gap:8px;margin-top:6px;padding-left:42px}
.pill-btn{background:var(--tile-bg);border:0;color:var(--text-main);border-radius:8px;padding:6px 12px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:5px;cursor:pointer;outline:none;line-height:normal;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,0.4);transition:transform .12s ease,background .15s ease;font-family:inherit}
.pill-btn:active{transform:scale(0.92);background:rgba(255,255,255,0.38);color:#ffffff}
.pill-btn.room-active{background:rgba(16,185,129,0.32);border:1px solid rgba(16,185,129,0.6)}
.room-indicator{width:7px;height:7px;border-radius:50%;background:var(--accent-green);box-shadow:0 0 8px var(--accent-green);display:inline-block}
.icon-btn{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;background:var(--tile-bg);border:0;color:var(--text-main);cursor:pointer;outline:none;flex-shrink:0;box-shadow:0 8px 24px rgba(0,0,0,0.4);transition:transform .12s ease,background .15s ease}
.icon-btn:active{transform:scale(0.92);background:rgba(255,255,255,0.38);color:#ffffff}
.center-ctrls{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:36px;z-index:28;transition:opacity .25s ease;pointer-events:none}
.c-btn{width:56px;height:56px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--tile-bg);border:0;color:#fff;cursor:pointer;outline:none;box-shadow:0 8px 24px rgba(0,0,0,0.4);transition:transform .12s ease,background .15s ease;pointer-events:auto}
.c-btn:active{transform:scale(0.92);background:rgba(255,255,255,0.38)}
.c-play{width:70px;height:70px;background:rgba(28,28,32,0.92);backdrop-filter:blur(8px)}
.c-btn svg{width:24px;height:24px;fill:currentColor}
.c-play svg{width:32px;height:32px;fill:currentColor}
.bottom-bar{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:6px;padding:12px 14px calc(10px + env(safe-area-inset-bottom, 0px));background:linear-gradient(0deg,#000000 0%,rgba(0,0,0,0.97) 64%,rgba(0,0,0,0.68) 86%,transparent 100%);z-index:30;transition:opacity .25s ease}
.timeline-box{position:relative;width:100%;height:20px;display:flex;align-items:center;cursor:pointer}
.timeline-track{position:absolute;left:0;right:0;height:4px;background:rgba(255,255,255,0.18);border-radius:2px;pointer-events:none}
.timeline-buffer{position:absolute;left:0;height:4px;background:rgba(255,255,255,0.42);border-radius:2px;width:0%;pointer-events:none;transition:width .12s linear}
.timeline-played{position:absolute;left:0;height:4px;background:#ffffff;border-radius:2px;width:0%;pointer-events:none}
.timeline-seek{position:absolute;left:0;right:0;width:100%;height:20px;margin:0;padding:0;background:transparent;outline:none;border:0;-webkit-appearance:none;appearance:none;cursor:pointer;z-index:2}
.timeline-seek::-webkit-slider-runnable-track{height:20px;background:transparent;border:0}
.timeline-seek::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:#ffffff;border:0;outline:none;margin-top:3px;box-shadow:0 1px 4px rgba(0,0,0,0.6)}
.timeline-seek::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#ffffff;border:0;box-shadow:0 1px 4px rgba(0,0,0,0.6)}
.b-row{display:flex;align-items:center;justify-content:space-between;height:28px}
.time-lbl{font-size:13px;font-variant-numeric:tabular-nums;color:var(--text-main);font-weight:700;display:inline-flex;align-items:center;height:28px;line-height:28px;letter-spacing:0.3px}
.b-actions{display:flex;align-items:center;gap:8px;height:28px}
.skip-btn{width:34px;height:28px;border-radius:7px;background:var(--tile-bg);border:0;color:var(--text-main);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;line-height:1;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,0.4);transition:transform .12s ease,background .15s ease}
.skip-btn:active{transform:scale(0.92);background:rgba(255,255,255,0.38)}
.pip-btn{width:32px;height:28px;border-radius:7px;background:var(--tile-bg);border:0;color:var(--text-main);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,0.4);transition:transform .12s ease,background .15s ease}
.pip-btn:active{transform:scale(0.92);background:rgba(255,255,255,0.38)}
.fs-btn{width:28px;height:28px;border-radius:7px;background:var(--tile-bg);border:0;color:var(--text-main);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,0.4);transition:transform .12s ease,background .15s ease}
.fs-btn:active{transform:scale(0.92);background:rgba(255,255,255,0.38)}
.toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--panel-bg);border:0;padding:10px 18px;border-radius:10px;font-size:12px;font-weight:600;text-align:center;max-width:86%;z-index:45;box-shadow:0 10px 25px rgba(0,0,0,0.85);display:none}
.badge{position:absolute;top:18%;left:50%;transform:translateX(-50%);background:var(--panel-bg);border:0;padding:6px 14px;border-radius:8px;font-size:12px;font-weight:700;display:none;pointer-events:none;z-index:40}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(4px);z-index:60;display:none;align-items:flex-end;justify-content:center}
.modal-bg.centered{align-items:center;padding:16px}
.modal-sheet{width:100%;max-width:440px;background:var(--sheet-bg);border-top-left-radius:18px;border-top-right-radius:18px;border:0;padding:16px;max-height:82%;display:flex;flex-direction:column;box-shadow:0 20px 40px rgba(0,0,0,0.85)}
.modal-bg.centered .modal-sheet{border-radius:18px;border:1px solid rgba(255,255,255,0.12)}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,0.12)}
.modal-title{font-size:14px;font-weight:700;color:var(--text-main)}
.modal-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;overflow-y:auto;padding:10px 0;max-height:48vh}
.ep-tile{padding:10px 4px;font-size:11px;font-weight:700;text-align:center;background:var(--tile-bg);border:0;color:var(--text-main);border-radius:8px;cursor:pointer}
.ep-tile.active{background:#ffffff;color:#121212;box-shadow:0 4px 14px rgba(255,255,255,0.3)}
.dropdown{position:absolute;background:rgba(28,28,30,0.96);border:0;border-radius:10px;padding:4px;z-index:70;display:none;flex-direction:column;box-shadow:0 12px 30px rgba(0,0,0,0.9);max-height:242px;overflow-y:auto}
.drop-item{padding:8px 14px;font-size:12px;font-weight:600;color:var(--text-main);background:transparent;border:0;text-align:left;cursor:pointer;border-radius:6px;font-variant-numeric:tabular-nums}
.drop-item.active{color:#121212;background:#ffffff}
.lock-unlock-btn{position:absolute;top:calc(10px + env(safe-area-inset-top, 0px));right:14px;height:32px;background:var(--tile-bg);border:0;color:#fff;padding:0 14px;border-radius:8px;font-size:12px;font-weight:700;z-index:80;display:none;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,0.4);transition:transform .12s ease,background .15s ease}
.lock-unlock-btn:active{transform:scale(0.92);background:rgba(255,255,255,0.38)}
.form-group{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.form-label{font-size:12px;font-weight:600;color:var(--text-sub)}
.form-input{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:10px;padding:10px 14px;color:#fff;font-size:14px;outline:none}
.form-input:focus{border-color:rgba(255,255,255,0.5)}
.form-err{font-size:12px;color:#f87171;margin-top:4px;display:none}
.action-btn{background:#ffffff;color:#121212;border:0;border-radius:10px;padding:12px;font-size:13px;font-weight:700;cursor:pointer;outline:none;margin-top:16px}
.action-btn.secondary{background:rgba(255,255,255,0.15);color:#fff;margin-top:8px}
.action-btn.danger{background:rgba(239,68,68,0.25);color:#fca5a5;border:1px solid rgba(239,68,68,0.4)}
.room-link-box{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.06);padding:8px 12px;border-radius:10px;margin-top:12px;border:1px dashed rgba(255,255,255,0.2)}
.room-link-text{flex:1;font-size:12px;color:var(--text-sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copy-btn{background:var(--tile-bg);border:0;color:#fff;border-radius:6px;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0}
.user-list{display:flex;flex-direction:column;gap:8px;max-height:220px;overflow-y:auto;margin-top:14px}
.user-item{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,0.06);padding:8px 12px;border-radius:8px;gap:8px}
.user-name{font-size:12px;font-weight:600;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.btn-sm{padding:4px 8px;border-radius:6px;font-size:10px;font-weight:700;cursor:pointer;border:0}
.btn-promote{background:rgba(59,130,246,0.3);color:#bfdbfe}
.btn-kick{background:rgba(239,68,68,0.3);color:#fecaca}
body.hud-off .top-bar,body.hud-off .center-ctrls,body.hud-off .bottom-bar{opacity:0;pointer-events:none}
body.locked .top-bar,body.locked .center-ctrls,body.locked .bottom-bar{display:none!important}
body.mode-surface #qualityBtn{display:none!important}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.light.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
<div class="app" id="appRoot">
  <div class="stage" id="stage">
    <video id="vid" playsinline preload="auto"></video>
    <div class="surface-curtain" id="surfaceCurtain"></div>
    <div class="surface-mask-top"></div>
    <div class="surface-mask-bottom"></div>
    <div class="toast" id="toast"></div>
    <div class="badge" id="badge"></div>
    <button type="button" class="lock-unlock-btn" id="unlockBtn">Разблокировать экран</button>

    <div class="top-bar" id="topBar">
      <div class="top-row">
        <div class="top-left">
          <button type="button" class="icon-btn" id="backBtn" aria-label="Сменить источник видео">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <button type="button" class="title-btn" id="titleLbl">Загрузка...</button>
        </div>
        <div class="top-right">
          <button type="button" class="pill-btn" id="roomBtn">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span id="roomBtnLbl">Создать комнату</span>
          </button>
          <button type="button" class="pill-btn" id="speedBtn"><span id="speedLbl">1x</span><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
          <button type="button" class="pill-btn" id="qualityBtn"><span id="qualityLbl">720p</span><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
          <button type="button" class="icon-btn" id="lockBtn" aria-label="Заблокировать экран">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>
          </button>
        </div>
      </div>
      <div class="sub-bar" id="subBar">
        <button type="button" class="pill-btn" id="epPickerBtn"><span id="epCurLbl">1 серия</span><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
        <button type="button" class="pill-btn" id="voicePickerBtn"><span id="voiceCurLbl" style="max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Озвучка</span><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
      </div>
    </div>

    <div class="center-ctrls" id="centerCtrls">
      <button type="button" class="c-btn" id="cPrevBtn" aria-label="Предыдущая серия"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
      <button type="button" class="c-btn c-play" id="cPlayBtn" aria-label="Воспроизвести или пауза"><svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <button type="button" class="c-btn" id="cNextBtn" aria-label="Следующая серия"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
    </div>

    <div class="bottom-bar" id="bottomBar">
      <div class="timeline-box" id="timelineBox">
        <div class="timeline-track"></div>
        <div class="timeline-buffer" id="timelineBuffer"></div>
        <div class="timeline-played" id="timelinePlayed"></div>
        <input id="seek" class="timeline-seek" type="range" aria-label="Позиция воспроизведения" min="0" max="1000" step="1" value="0">
      </div>
      <div class="b-row">
        <span class="time-lbl" id="timeLbl">00:00 / 00:00</span>
        <div class="b-actions">
          <button type="button" class="skip-btn" id="skip125Btn" title="Пропуск 1:25">»</button>
          <button type="button" class="pip-btn" id="miniPipBtn" aria-label="Картинка в картинке">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><rect x="12" y="11" width="7" height="6" rx="1" fill="currentColor" stroke="none"/></svg>
          </button>
          <button type="button" class="fs-btn" id="fsBtn" aria-label="Полный экран">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="dropdown" id="speedDrop"></div>
    <div class="dropdown" id="qualityDrop"></div>

    <div class="modal-bg centered" id="createRoomModal">
      <div class="modal-sheet">
        <div class="modal-hdr">
          <span class="modal-title">Создать комнату совместного просмотра</span>
          <button type="button" class="pill-btn" id="closeCreateRoomBtn" aria-label="Закрыть"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        </div>
        <div class="form-group">
          <label class="form-label" for="createNickInput">Ваше имя (обязательно):</label>
          <input class="form-input" id="createNickInput" type="text" placeholder="Например: Иван" maxlength="24">
          <div class="form-err" id="createRoomErr">Укажите ваше имя</div>
        </div>
        <div class="form-group">
          <label class="form-label" for="createPassInput">Пароль комнаты (необязательно):</label>
          <input class="form-input" id="createPassInput" type="password" placeholder="Оставьте пустым, если без пароля">
        </div>
        <button type="button" class="action-btn" id="startRoomSubmitBtn">Открыть сервер комнаты</button>
        <button type="button" class="action-btn secondary" id="switchToJoinBtn">Войти в существующую по ID</button>
      </div>
    </div>

    <div class="modal-bg centered" id="joinRoomModal">
      <div class="modal-sheet">
        <div class="modal-hdr">
          <span class="modal-title">Вход в комнату</span>
          <button type="button" class="pill-btn" id="closeJoinRoomBtn" aria-label="Закрыть"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        </div>
        <div class="form-group">
          <label class="form-label" for="joinRoomIdInput">ID комнаты:</label>
          <input class="form-input" id="joinRoomIdInput" type="text" placeholder="room-xxxxxx">
        </div>
        <div class="form-group">
          <label class="form-label" for="joinNickInput">Ваше имя (обязательно):</label>
          <input class="form-input" id="joinNickInput" type="text" placeholder="Введите никнейм" maxlength="24">
        </div>
        <div class="form-group">
          <label class="form-label" for="joinPassInput">Пароль комнаты (если установлен):</label>
          <input class="form-input" id="joinPassInput" type="password" placeholder="Введите пароль">
        </div>
        <div class="form-err" id="joinRoomErr">Проверьте ID комнаты и имя</div>
        <button type="button" class="action-btn" id="connectRoomSubmitBtn">Подключиться к просмотру</button>
      </div>
    </div>

    <div class="modal-bg centered" id="manageRoomModal">
      <div class="modal-sheet">
        <div class="modal-hdr">
          <span class="modal-title" id="manageModalTitle">Комната просмотра</span>
          <button type="button" class="pill-btn" id="closeManageRoomBtn" aria-label="Закрыть"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        </div>
        <div class="room-link-box">
          <span class="room-link-text" id="roomLinkDisplay"></span>
          <button type="button" class="copy-btn" id="copyRoomLinkBtn">Скопировать</button>
        </div>
        <div class="form-label" style="margin-top:12px">Участники онлайн:</div>
        <div class="user-list" id="roomUsersList"></div>

  var iframeRegex=new RegExp('<iframe[^>]+src=["\']([^"\']+)["\']','i');
  var httpSchemeRegex=new RegExp('^https?:'+SLASH_PAIR,'i');
  var bareHostRegex=new RegExp('^[a-z0-9.-]+\\.[a-z]{2,}\\/','i');

  function normalizeSrc(raw){
    var cur=(raw||'').trim();
    if(!cur)return '';
    var m=cur.match(iframeRegex);
    if(m&&m[1])cur=m[1].trim();
    for(var i=0;i<5;i++){
      if(cur.indexOf(SLASH_PAIR)===0)cur=PROTO_HTTPS+cur;
      else if(!httpSchemeRegex.test(cur)&&bareHostRegex.test(cur))cur=PROTO_HTTPS+SLASH_PAIR+cur;
      try{
        var u=new URL(cur);
        var inner=u.searchParams.get('src')||u.searchParams.get('url')||u.searchParams.get('link');
        if(inner&&inner.trim()&&inner.trim()!==cur){cur=inner.trim();continue;}
      }catch(e){
        try{
          var dec=decodeURIComponent(cur);
          if(dec!==cur&&(dec.indexOf('http')===0||dec.indexOf(SLASH_PAIR)===0)){cur=dec.trim();continue;}
        }catch(err){break;}
      }
      break;
    }
    if(cur.indexOf(SLASH_PAIR)===0)cur=PROTO_HTTPS+cur;
    else if(!httpSchemeRegex.test(cur)&&bareHostRegex.test(cur))cur=PROTO_HTTPS+SLASH_PAIR+cur;
    if(cur.indexOf('test-streams.mux.dev')!==-1||cur.indexOf('x36xhzz.m3u8')!==-1)return '';
    return cur;
  }

  function stripScheme(url){
    var c=(url||'').trim();
    if(c.indexOf(PROTO_HTTPS)===0)return c.slice(6);
    if(c.indexOf(PROTO_HTTP)===0)return c.slice(5);
    return c;
  }

  function isDirectStream(url){
    if(!url)return false;
    var base=url.split('?')[0].toLowerCase();
    return base.slice(-5)==='.m3u8'||base.slice(-4)==='.mp4'||base.slice(-5)==='.webm'||url.indexOf(':hls:manifest.m3u8')!==-1;
  }

  function buildSurfaceUrl(embedUrl,resumeAt){
    var clean=normalizeSrc(embedUrl);
    if(!clean)return '';
    try{
      var u=new URL(clean);
      u.searchParams.set('hide_selectors','true');
      u.searchParams.delete('autoplay');
      if(resumeAt>1)u.searchParams.set('start_from',String(Math.floor(resumeAt)));
      return u.toString();
    }catch(e){
      var sep=clean.indexOf('?')!==-1?'&':'?';
      var resParam=resumeAt>1?('&start_from='+Math.floor(resumeAt)):'';
      return clean+sep+'hide_selectors=true'+resParam;
    }
  }

  function decodeRegistryTok(enc){
    var raw=(enc||'').trim();
    if(!raw||raw.length<4)return '';
    var half=Math.floor(raw.length/2);
    function rev(s){return s.split('').reverse().join('');}
    function b64(s){var c=s.replace(/[^A-Za-z0-9+/=]/g,'');var p=(4-(c.length%4))%4;return atob(c+'===='.slice(0,p));}
    return b64(rev(raw.slice(half)))+b64(rev(raw.slice(0,half)));
  }

  var cachedClientGroups={};

  function compareNat(a,b){
    var ta=String(a).trim(),tb=String(b).trim();
    var ad=/^\d+$/.test(ta),bd=/^\d+$/.test(tb);
    if(ad&&bd)return parseInt(ta,10)-parseInt(tb,10);
    if(ad!==bd)return ad?-1:1;
    return ta.toLowerCase().localeCompare(tb.toLowerCase());
  }

  function extractEpisodesFromEntry(entry){
    var list=[];
    if(entry&&entry.seasons&&typeof entry.seasons==='object'){
      var sKeys=Object.keys(entry.seasons).sort(compareNat);
      for(var i=0;i<sKeys.length;i++){
        var sKey=sKeys[i],sObj=entry.seasons[sKey];
        var eps=sObj&&sObj.episodes;
        if(!eps||typeof eps!=='object')continue;
        var eKeys=Object.keys(eps).sort(compareNat);
        for(var j=0;j<eKeys.length;j++){
          var eKey=eKeys[j],val=eps[eKey];
          var lnk=typeof val==='string'?val:(val&&val.link?val.link:'');
          var norm=normalizeSrc(lnk);
          if(norm)list.push({s:String(sKey),e:String(eKey),label:eKey+' серия',link:norm});
        }
      }
    }
    if(!list.length&&entry&&entry.link){
      var fb=normalizeSrc(entry.link);
      if(fb)list.push({s:String(entry.last_season||'1'),e:String(entry.last_episode||'1'),label:'1 серия',link:fb});
    }
    return list;
  }

  function formatTrLabel(entry){

    var title=String(tr.title||'Озвучка').trim();

    var tLabel=rawType==='voice'?'Озвучка':(rawType==='subtitles'?'Субтитры':(rawType||'Перевод'));
    var meta=[tLabel];
    if(entry.quality)meta.push(String(entry.quality).trim());
    if(entry.episodes_count!==undefined&&entry.episodes_count!==null)meta.push('эп: '+entry.episodes_count);
    return title+' ('+meta.join(' • ')+')';
  }

  function groupKodikEntries(items){
    var map={},order=[];
    for(var i=0;i<(items||[]).length;i++){
      var ent=items[i];
      if(!ent||typeof ent!=='object')continue;
      var shiki=String(ent.shikimori_id||'').trim();
      var kp=String(ent.kinopoisk_id||'').trim();
      var imdb=String(ent.imdb_id||'').trim();
      var mdl=String(ent.mdl_id||'').trim();
      var tRu=String(ent.title||'').trim();
      var tOrig=String(ent.title_orig||'').trim();
      var gk,spec;
      if(shiki){gk='shiki:'+shiki;spec={mode:'shikimori_id',value:shiki};}
      else if(kp){gk='kp:'+kp;spec={mode:'kinopoisk_id',value:kp};}
      else if(imdb){gk='imdb:'+imdb;spec={mode:'imdb_id',value:imdb};}
      else if(mdl){gk='mdl:'+mdl;spec={mode:'mdl_id',value:mdl};}
      else{gk='title:'+(tOrig||tRu||ent.id||'').toLowerCase();spec={mode:'title',value:tRu||tOrig};}
      if(!map[gk]){
        map[gk]={group_key:gk,lookup_spec:spec,title:tRu||tOrig||'Kodik',variants:[]};
        order.push(map[gk]);
      }
      map[gk].variants.push(ent);
    }
    for(var k=0;k<order.length;k++)cachedClientGroups[order[k].group_key]=order[k];
    return order;
  }

  function serializeClientGroup(grp,vi,targetSrc){
    var rawVars=grp.variants||[];
    var normT=stripScheme(normalizeSrc(targetSrc||''));
    var cV=rawVars.length?Math.max(0,Math.min(vi||0,rawVars.length-1)):0,cE=0;
    var outVars=[];

      var ent=rawVars[i],eps=extractEpisodesFromEntry(ent);
      if(normT){
        if(ent.link&&stripScheme(normalizeSrc(ent.link)).indexOf(normT)!==-1)cV=i;
        for(var j=0;j<eps.length;j++){
          if(stripScheme(eps[j].link).indexOf(normT)!==-1){cV=i;cE=j;break;}
        }
      }
      outVars.push({id:String((ent.translation&&ent.translation.id)||i),label:formatTrLabel(ent),episodes:eps});
    }
    return {ok:true,group_key:grp.group_key,title:grp.title||'Kodik',variant_idx:cV,ep_idx:cE,variants:outVars};
  }

  function fetchWithTimeout(url,ms){
    var ctrl=typeof AbortController!=='undefined'?new AbortController():null;
    var tid=ctrl?setTimeout(function(){ctrl.abort();},ms):null;
    return fetch(url,ctrl?{signal:ctrl.signal}:{}).finally(function(){if(tid)clearTimeout(tid);});
  }

  function getSavedPublicToken(){
    try{
      var d=JSON.parse(localStorage.getItem('kp_kodik_public_token_v1')||'{}');
      if(d.token&&d.ts&&(Date.now()-d.ts)<1200000)return d.token;
    }catch(e){}
    return '';
  }

  function savePublicToken(tok){
    try{localStorage.setItem('kp_kodik_public_token_v1',JSON.stringify({token:tok,ts:Date.now()}));}catch(e){}
  }

  function fetchRegistryTokens(){
    return fetchWithTimeout(REGISTRY_TOKENS_URL,4500).then(function(r){
      if(!r.ok)return [];
      return r.json();
    }).then(function(d){
      var arr=(d.stable||[]).concat(d.unstable||[]),out=[];
      for(var i=0;i<arr.length;i++){
        var enc=arr[i]&&(arr[i].tokn||arr[i].tok);
        if(!enc)continue;

  function queryKodikWithTokens(tokens,spec){
    var pairs=[];
    for(var i=0;i<tokens.length;i++){
      for(var j=0;j<KODIK_API_URLS.length;j++)pairs.push({tok:tokens[i],ep:KODIK_API_URLS[j]});
    }
    var idx=0;
    function next(){
      if(idx>=pairs.length)return Promise.resolve(null);
      var cur=pairs[idx++];
      var u=new URL(cur.ep);
      u.searchParams.set('token',cur.tok);
      u.searchParams.set('limit','35');
      u.searchParams.set('with_material_data','true');
      u.searchParams.set('with_episodes','true');
      u.searchParams.set(spec.mode,spec.value);

        if(!r.ok)return next();
        return r.json().then(function(p){
          if(p&&!p.error&&Array.isArray(p.results)){savePublicToken(cur.tok);return p.results;}
          return next();
        });
      }).catch(function(){return next();});
    }
    return next();
  }

  function browserKodikSearch(spec){
    var pool=[],saved=getSavedPublicToken();
    if(saved)pool.push(saved);
    for(var i=0;i<PUBLIC_FALLBACK_TOKENS.length;i++){
      if(pool.indexOf(PUBLIC_FALLBACK_TOKENS[i])===-1)pool.push(PUBLIC_FALLBACK_TOKENS[i]);
    }
    return queryKodikWithTokens(pool,spec).then(function(res){
      if(res)return res;
      return fetchRegistryTokens().then(function(fresh){
        if(!fresh.length)return null;
        return queryKodikWithTokens(fresh,spec);
      });
    });
  }

  function parseSearchTarget(raw){
    var c=(raw||'').replace(/\s+/g,' ').trim();
    if(!c)return null;
    if(c.indexOf('http')===0||c.indexOf(SLASH_PAIR)===0||c.indexOf('kodik')!==-1){
      var n=normalizeSrc(c);return n?{mode:'player_link',value:n}:null;
    }
    var mShiki=c.match(/^(?:shiki|shikimori|шики)\s*[:=]?\s*(\d+)$/i);
    if(mShiki)return {mode:'shikimori_id',value:mShiki[1]};
    var mKp=c.match(/^(?:kp|kinopoisk|кп)\s*[:=]?\s*(\d+)$/i);
    if(mKp)return {mode:'kinopoisk_id',value:mKp[1]};
    var mImdb=c.match(/^(?:imdb\s*[:=]?\s*)?(tt\d{5,12})$/i);
    if(mImdb)return {mode:'imdb_id',value:mImdb[1].toLowerCase()};
    var mMdl=c.match(/^mdl\s*[:=]?\s*(\S+)$/i);
    if(mMdl)return {mode:'mdl_id',value:mMdl[1]};
    return {mode:'title',value:c};
  }

  function resolveClientContext(opts){
    var cleanSrc=opts.src?normalizeSrc(opts.src):'';
    var gk=(opts.gk||'').trim();
    var q=(opts.q||'').trim();
    var vi=opts.vi||0;

    if(cleanSrc&&isDirectStream(cleanSrc)){
      return Promise.resolve({ok:true,group_key:cleanSrc,title:'Прямой поток',variant_idx:0,ep_idx:0,variants:[{id:'direct',label:'Прямой поток',episodes:[{s:'1',e:'1',label:'1 серия',link:cleanSrc}]}]});
    }
    if(gk&&cachedClientGroups[gk]){
      return Promise.resolve(serializeClientGroup(cachedClientGroups[gk],vi,cleanSrc));
    }
    if(gk&&gk.indexOf(':')>0){
      var pfx=gk.slice(0,gk.indexOf(':')),idv=gk.slice(gk.indexOf(':')+1);
      var mMap={shiki:'shikimori_id',kp:'kinopoisk_id',imdb:'imdb_id',mdl:'mdl_id'};
      if(mMap[pfx]&&idv){
        return browserKodikSearch({mode:mMap[pfx],value:idv}).then(function(items){
          if(!items||!items.length)return null;
          var grps=groupKodikEntries(items);
          var hit=cachedClientGroups[gk]||grps[0];
          return serializeClientGroup(hit,vi,cleanSrc);
        });
      }
    }
    if(q&&!cleanSrc){
      var spec=parseSearchTarget(q);
      if(!spec)return Promise.resolve(null);
      return browserKodikSearch(spec).then(function(items){
        if(!items||!items.length)return null;
        var grps=groupKodikEntries(items),prim=grps[0];
        if(prim.lookup_spec&&prim.lookup_spec.mode!==spec.mode){
          return browserKodikSearch(prim.lookup_spec).then(function(exp){
            if(exp&&exp.length){
              var eg=groupKodikEntries(exp);
              prim=cachedClientGroups[prim.group_key]||eg[0]||prim;
            }
            return serializeClientGroup(prim,vi,'');
          });
        }
        return serializeClientGroup(prim,vi,'');
      });
    }
    if(cleanSrc){
      var stripT=stripScheme(cleanSrc);
      var cKeys=Object.keys(cachedClientGroups);
      for(var cI=0;cI<cKeys.length;cI++){
        var cg=cachedClientGroups[cKeys[cI]];
        for(var vI=0;vI<cg.variants.length;vI++){
          var ent=cg.variants[vI];
          if(ent.link&&stripScheme(normalizeSrc(ent.link)).indexOf(stripT)!==-1)return Promise.resolve(serializeClientGroup(cg,vI,cleanSrc));
          var ceps=extractEpisodesFromEntry(ent);
          for(var eI=0;eI<ceps.length;eI++){
            if(stripScheme(ceps[eI].link).indexOf(stripT)!==-1)return Promise.resolve(serializeClientGroup(cg,vI,cleanSrc));
          }
        }
      }
      return browserKodikSearch({mode:'player_link',value:cleanSrc}).then(function(items){
        if(!items||!items.length)return null;
        var grps=groupKodikEntries(items);
        if(!grps.length)return null;
        var prim=grps[0];
        if(prim.lookup_spec){
          return browserKodikSearch(prim.lookup_spec).then(function(full){
            if(full&&full.length){
              var eg=groupKodikEntries(full);
              prim=cachedClientGroups[prim.group_key]||eg[0]||prim;
            }
            return serializeClientGroup(prim,vi,cleanSrc);
          });
        }
        return serializeClientGroup(prim,vi,cleanSrc);
      });
    }
    return Promise.resolve(null);
  }

  var qParams=new URLSearchParams(window.location.search);
  var initialRoomId=(qParams.get('room')||'').trim();
  var initialGk=(qParams.get('gk')||'').trim();
  var initialVi=parseInt(qParams.get('vi')||'0',10)||0;
  var customApiBase=(qParams.get('api')||localStorage.getItem('kp_api_base')||'').trim().replace(/\/+$/,'');
  var currentSrc=normalizeSrc(qParams.get('src')||qParams.get('url')||qParams.get('link')||'');
  var rawInitTitle=(qParams.get('title')||'').trim();
  var customTitle=(rawInitTitle&&rawInitTitle!=='Демо Поток')?rawInitTitle:'';
  var groupKey=initialGk||currentSrc;

      if(!draggingSeek)seek.value=String(Math.round((cur/dur)*1000));
      var maxBuf=0;
      if(!activeIframe&&vid.buffered&&vid.buffered.length>0){
        for(var i=0;i<vid.buffered.length;i++){
          if(vid.buffered.start(i)<=cur+1.0&&vid.buffered.end(i)>maxBuf)maxBuf=vid.buffered.end(i);
        }
        if(maxBuf===0){for(var j=0;j<vid.buffered.length;j++){if(vid.buffered.end(j)>maxBuf)maxBuf=vid.buffered.end(j);}}
      }else{maxBuf=cur;}
      var bufPct=Math.max(progPct,Math.min(100,(maxBuf/dur)*100));

  function mountSurface(embedUrl,resumeAt){
    if(hls){try{hls.destroy();}catch(e){}hls=null;}
    try{vid.pause();vid.removeAttribute('src');vid.load();}catch(e){}
    vid.style.display='none';
    streams={};proxyStreams={};
    iframeCurTime=resumeAt>1?resumeAt:0;

    surfaceBooted=false;

    document.body.classList.add('mode-surface');

    timeLbl.textContent=fmtTime(iframeCurTime)+' / 00:00';

    if(!activeIframe){

      activeIframe.setAttribute('allow','autoplay; fullscreen; picture-in-picture');
      stage.insertBefore(activeIframe,stage.firstChild);
    }
    activeIframe.onload=function(){

  function mountStream(url,proxyUrl,fallbackEmbed,resumeAt){
    document.body.classList.remove('mode-surface','surface-paused');
    surfaceCurtain.style.display='none';
    if(activeIframe){try{activeIframe.remove();}catch(e){}activeIframe=null;}
    vid.style.display='block';
    if(hls){try{hls.destroy();}catch(e){}hls=null;}
    try{vid.pause();vid.removeAttribute('src');vid.load();}catch(e){}
    var started=false,triedProxy=false;
    function readyOnce(){
      if(started)return;started=true;
      msg('',false);
      if(resumeAt>1){try{vid.currentTime=resumeAt;}catch(e){}}
      applyRateToVideo();
      var p=vid.play();
      if(p&&p.catch)p.catch(function(){updatePlayButtonVisual(true);wakeHud();});
    }
    function attach(srcToUse){
      var isM3u8=srcToUse.indexOf('.m3u8')!==-1||srcToUse.indexOf('/api/hls?url=')!==-1;
      if(window.Hls&&window.Hls.isSupported()&&isM3u8){
        hls=new window.Hls({maxBufferLength:30,maxMaxBufferLength:60,enableWorker:true,lowLatencyMode:false});
        hls.loadSource(srcToUse);
        hls.attachMedia(vid);
        hls.on(window.Hls.Events.MANIFEST_PARSED,readyOnce);
        hls.on(window.Hls.Events.ERROR,function(ev,d){
          if(!d||!d.fatal)return;
          if(!triedProxy&&proxyUrl&&srcToUse!==proxyUrl){triedProxy=true;try{hls.destroy();}catch(e){}hls=null;attach(proxyUrl);return;}
          if(d.type===window.Hls.ErrorTypes.NETWORK_ERROR){hls.startLoad();return;}
          if(d.type===window.Hls.ErrorTypes.MEDIA_ERROR){hls.recoverMediaError();return;}
          if(fallbackEmbed&&!isDirectStream(fallbackEmbed))mountSurface(fallbackEmbed,resumeAt||0);
          else msg('Ошибка воспроизведения потока',true,true);
        });
      }else{
        vid.src=srcToUse;vid.onloadedmetadata=readyOnce;vid.oncanplay=readyOnce;
        vid.onerror=function(){
          if(!triedProxy&&proxyUrl&&srcToUse!==proxyUrl){triedProxy=true;attach(proxyUrl);}
          else if(fallbackEmbed&&!isDirectStream(fallbackEmbed))mountSurface(fallbackEmbed,resumeAt||0);
          else msg('Ошибка загрузки видео',true,true);
        };
        vid.load();
      }
    }
    attach(url);
  }

    }else if(k==='kodik_player_play'||k==='kodik_player_video_started'){
      surfaceBooted=true;

      msg('',false);
      iframePaused=false;

      surfaceInPip=true;

      surfaceInPip=false;
    }
  });

  function tryStreamEndpoints(epLink){
    var cands=[];
    if(customApiBase)cands.push({url:customApiBase+'/api/stream?link='+encodeURIComponent(epLink),ms:6000});
    if(!isStaticGithubHost)cands.push({url:'/api/stream?link='+encodeURIComponent(epLink),ms:6000});
    cands.push({url:LOCAL_EXTERA_API+'/api/stream?link='+encodeURIComponent(epLink),ms:900});
    var idx=0;
    function step(){
      if(idx>=cands.length)return Promise.resolve(null);
      var item=cands[idx++];
      return fetchWithTimeout(item.url,item.ms).then(function(r){
        if(!r.ok)return step();
        return r.json().then(function(d){
          if(d&&d.ok&&d.streams&&Object.keys(d.streams).length>0)return d;
          return step();
        });
      }).catch(function(){return step();});
    }
    return step();
  }

  function loadCurrent(resumeAt){
    var eps=((ctxData&&ctxData.variants&&ctxData.variants[vIdx]&&ctxData.variants[vIdx].episodes)||[]);
    if(!eps.length)return msg('Нет доступных серий релиза',true,true);
    if(eIdx<0||eIdx>=eps.length)eIdx=0;
    var ep=eps[eIdx];
    currentSrc=ep.link;
    epCurLbl.textContent=ep.label;
    voiceCurLbl.textContent=((ctxData.variants&&ctxData.variants[vIdx]&&ctxData.variants[vIdx].label.split(' (')[0])||'Озвучка');
    cPrevBtn.style.opacity=eIdx<=0?'0.35':'1';
    cNextBtn.style.opacity=eIdx+1>=eps.length?'0.35':'1';

    reqSeq+=1;var mySeq=reqSeq;
    msg('Загрузка потока: '+ep.label+'...',true);

    if(isDirectStream(ep.link)){
      streams={'720':ep.link};
      proxyStreams=isStaticGithubHost?{}:{'720':'/api/hls?url='+encodeURIComponent(ep.link)};
      curQ='720';qualityLbl.textContent='720p';
      buildQualityDrop(['720']);
      mountStream(ep.link,proxyStreams['720'],null,resumeAt||0);
      return;
    }

    tryStreamEndpoints(ep.link).then(function(d){
      if(mySeq!==reqSeq)return;
      if(d&&d.streams&&Object.keys(d.streams).length>0){
        streams=d.streams;
        proxyStreams=d.proxyStreams||{};
        var qs=d.qualities||Object.keys(streams).sort(function(a,b){return Number(a)-Number(b);});
        if(!streams[curQ])curQ=streams['720']?'720':(qs[qs.length-1]||'');
        qualityLbl.textContent=curQ+'p';
        buildQualityDrop(qs.slice());
        mountStream(streams[curQ],proxyStreams[curQ],d.iframe||ep.link,resumeAt||0);
      }else{
        mountSurface(ep.link,resumeAt||0);
      }
    });
  }

  function applyResolvedContext(d,opts){
    ctxData=d;
    groupKey=d.group_key||opts.gk||opts.src||'';
    vIdx=d.variant_idx||0;
    eIdx=d.ep_idx||0;
    titleLbl.textContent=customTitle||d.title||'Kodik';
    var resumeSec=opts.resumeAt||0;
    if(!opts.skipResume&&!resumeSec){
      var saved=readProgress(groupKey);
      if(saved&&saved.time>5&&!(saved.dur>0&&saved.time/saved.dur>0.94)){
        if(!opts.src&&saved.v_idx<d.variants.length)vIdx=saved.v_idx;
        var tEps=(d.variants[vIdx]&&d.variants[vIdx].episodes)||[];
        if(!opts.src&&saved.e_idx<tEps.length)eIdx=saved.e_idx;
        if(saved.v_idx===vIdx&&saved.e_idx===eIdx){
          resumeSec=saved.time;
          flash('Продолжение: '+fmtTime(resumeSec));
        }
      }
    }
    loadCurrent(resumeSec);
    wakeHud();
  }

  function loadContext(opts){
    msg('Подготовка релиза...',true);
    var p=new URLSearchParams();
    if(opts.src)p.set('src',opts.src);
    if(opts.gk)p.set('gk',opts.gk);
    if(opts.vi!==undefined)p.set('vi',String(opts.vi));
    if(opts.q)p.set('q',opts.q);

    var serverCtxPromise;
    if(customApiBase){
      serverCtxPromise=fetchWithTimeout(customApiBase+'/api/context?'+p.toString(),5000).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});
    }else if(!isStaticGithubHost){
      serverCtxPromise=fetchWithTimeout('/api/context?'+p.toString(),5000).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});
    }else{
      serverCtxPromise=Promise.resolve(null);
    }

    serverCtxPromise.then(function(d){
      if(d&&d.ok&&d.variants&&d.variants.length>0)return d;
      return resolveClientContext(opts);
    }).then(function(d){
      if(d&&d.ok&&d.variants&&d.variants.length>0){
        applyResolvedContext(d,opts);
        return;
      }
      if(opts.src){
        ctxData={title:customTitle||'Kodik',variants:[{id:'0',label:'Озвучка',episodes:[{label:'1 серия',s:'1',e:'1',link:opts.src}]}]};
        vIdx=0;eIdx=0;
        titleLbl.textContent=customTitle||'Kodik';
        loadCurrent(opts.resumeAt||0);
      }else{
        msg('Релиз не найден',true,true);
      }
    });
  }

  function sendRoomAction(action,data){
    var pkt=Object.assign({type:'SYNC_ACTION',action:action},data);
    if(roomState.ws&&roomState.ws.readyState===WebSocket.OPEN){roomState.ws.send(JSON.stringify(pkt));return;}
    if(roomState.isHost){
      var out=Object.assign({},data,{type:action});
      Object.keys(roomState.peerConns).forEach(function(uid){var c=roomState.peerConns[uid];if(c&&c.open)c.send(out);});
    }else if(roomState.hostConn&&roomState.hostConn.open){
      roomState.hostConn.send(pkt);
    }
  }

  function handleServerPacket(pkt){
    if(!pkt)return;
    if(pkt.type==='ROOM_CREATED'||pkt.type==='JOIN_SUCCESS'){
      roomState.active=true;roomState.roomId=pkt.roomId;roomState.myId=pkt.userId;
      roomState.isHost=(pkt.role==='host');roomState.isAdmin=(pkt.role==='host'||pkt.role==='admin');
      roomState.users=pkt.users||[];
      updateRoomButtonUI();renderRoomUsers();syncBrowserUrl();
      flash(roomState.isHost?'Комната открыта: '+pkt.roomId:'Подключено к комнате');
      if(pkt.type==='JOIN_SUCCESS'&&pkt.state){
        if(pkt.state.rate)setRate(pkt.state.rate,false);
        if(pkt.state.src&&normalizeSrc(pkt.state.src)&&normalizeSrc(pkt.state.src)!==currentSrc){
          currentSrc=normalizeSrc(pkt.state.src);customTitle=pkt.state.title||'';syncBrowserUrl();
          loadContext({src:currentSrc,resumeAt:pkt.state.time||0,skipResume:true});
        }else if(pkt.state.time!==undefined){
          if(activeIframe)sendIframeKodikCmd('seek',{seconds:pkt.state.time});else vid.currentTime=pkt.state.time;
        }
        roomState.ignoreNextSync=true;
        if(pkt.state.paused){if(activeIframe){sendIframeKodikCmd('pause');iframePaused=true;updatePlayButtonVisual(true);}else vid.pause();}
        else{if(activeIframe){sendIframeKodikCmd('play');iframePaused=false;updatePlayButtonVisual(false);}else vid.play().catch(function(){});}
      }
      return;
    }
    if(pkt.type==='JOIN_ERROR'){flash(pkt.reason||'Ошибка входа');leaveRoom();return;}
    if(pkt.type==='USER_JOINED'||pkt.type==='USER_LEFT'||pkt.type==='USER_PROMOTED'||pkt.type==='USER_KICKED'){
      roomState.users=pkt.users||[];
      var selfU=roomState.users.find(function(u){return u.id===roomState.myId;});
      if(selfU){roomState.isHost=(selfU.role==='host');roomState.isAdmin=(selfU.role==='admin'||selfU.role==='host');}
      updateRoomButtonUI();renderRoomUsers();
      if(pkt.type==='USER_JOINED'&&pkt.user)flash('Вошёл: '+pkt.user.name);
      return;
    }
    if(pkt.type==='PLAY'){
      roomState.ignoreNextSync=true;
      if(activeIframe){if(pkt.time!==undefined)sendIframeKodikCmd('seek',{seconds:pkt.time});sendIframeKodikCmd('play');iframePaused=false;updatePlayButtonVisual(false);}
      else{if(pkt.time!==undefined&&Math.abs((vid.currentTime||0)-pkt.time)>1.5)vid.currentTime=pkt.time;vid.play().catch(function(){});}
      flash('Воспроизведение (хост)');return;
    }
    if(pkt.type==='PAUSE'){
      roomState.ignoreNextSync=true;
      if(activeIframe){if(pkt.time!==undefined)sendIframeKodikCmd('seek',{seconds:pkt.time});sendIframeKodikCmd('pause');iframePaused=true;updatePlayButtonVisual(true);}
      else{if(pkt.time!==undefined)vid.currentTime=pkt.time;vid.pause();}
      flash('Пауза (хост)');return;
    }
    if(pkt.type==='SEEK'&&pkt.time!==undefined){
      if(activeIframe){sendIframeKodikCmd('seek',{seconds:pkt.time});iframeCurTime=pkt.time;updateTimelineProgress();}else vid.currentTime=pkt.time;
      flash('Перемотка: '+fmtTime(pkt.time));return;
    }
    if(pkt.type==='RATE'&&pkt.rate!==undefined){setRate(pkt.rate,false);flash(fmtRate(pkt.rate));return;}
    if(pkt.type==='CHANGE_EP'){
      if(pkt.eIdx!==undefined)eIdx=pkt.eIdx;
      if(pkt.vIdx!==undefined)vIdx=pkt.vIdx;
      if(pkt.src)currentSrc=normalizeSrc(pkt.src);
      syncBrowserUrl();loadCurrent(0);flash('Смена серии');return;
    }
    if(pkt.type==='LOAD_MEDIA'&&pkt.src){
      var ns=normalizeSrc(pkt.src);if(!ns)return;
      currentSrc=ns;customTitle=pkt.title||'';syncBrowserUrl();
      loadContext({src:ns,skipResume:true});flash('Видео обновлено');return;
    }
    if(pkt.type==='HEARTBEAT'&&!roomState.isHost&&pkt.time!==undefined){
      if(Math.abs(getCurrentVideoTime()-pkt.time)>2.0){
        if(activeIframe)sendIframeKodikCmd('seek',{seconds:pkt.time});else vid.currentTime=pkt.time;
      }
      if(pkt.paused!==undefined&&pkt.paused!==isVideoPaused()){
        roomState.ignoreNextSync=true;
        if(pkt.paused){if(activeIframe){sendIframeKodikCmd('pause');iframePaused=true;updatePlayButtonVisual(true);}else vid.pause();}
        else{if(activeIframe){sendIframeKodikCmd('play');iframePaused=false;updatePlayButtonVisual(false);}else vid.play().catch(function(){});}
      }
      return;
    }
    if(pkt.type==='KICKED'){leaveRoom();flash(pkt.reason||'Вы исключены');}
  }

  function startP2PHost(nick,pass){
    if(!window.Peer){flash('Сервер комнат недоступен');return;}
    var code='room-'+Math.random().toString(36).slice(2,8),myUid='u-'+Math.random().toString(36).slice(2,9);
    var peer=new window.Peer('kp-wp-'+code);roomState.peer=peer;
    peer.on('open',function(){handleServerPacket({type:'ROOM_CREATED',roomId:code,userId:myUid,role:'host',users:[{id:myUid,name:nick,role:'host'}]});});
    peer.on('connection',function(conn){
      conn.on('data',function(raw){
        var pkt=typeof raw==='string'?JSON.parse(raw):raw;
        if(pkt.type==='JOIN_ROOM'){
          if(pass&&pass!==(pkt.pass||'')){conn.send({type:'JOIN_ERROR',reason:'Неверный пароль'});return;}
          var gid='u-'+Math.random().toString(36).slice(2,9),gUser={id:gid,name:(pkt.name||'Гость').slice(0,24),role:'viewer'};
          roomState.peerConns[gid]=conn;roomState.users.push(gUser);
          updateRoomButtonUI();renderRoomUsers();
          conn.send({type:'JOIN_SUCCESS',roomId:code,userId:gid,role:'viewer',users:roomState.users,state:{src:currentSrc,title:customTitle||titleLbl.textContent,time:getCurrentVideoTime(),paused:isVideoPaused(),rate:rate,vIdx:vIdx,eIdx:eIdx}});
          Object.keys(roomState.peerConns).forEach(function(uid){if(uid!==gid&&roomState.peerConns[uid].open)roomState.peerConns[uid].send({type:'USER_JOINED',user:gUser,users:roomState.users});});
          conn.on('close',function(){
            delete roomState.peerConns[gid];roomState.users=roomState.users.filter(function(u){return u.id!==gid;});
            updateRoomButtonUI();renderRoomUsers();
            Object.keys(roomState.peerConns).forEach(function(uid){if(roomState.peerConns[uid].open)roomState.peerConns[uid].send({type:'USER_LEFT',userId:gid,users:roomState.users});});
          });
        }else if(pkt.type==='SYNC_ACTION'){
          var gMetaId=null;
          Object.keys(roomState.peerConns).forEach(function(uid){if(roomState.peerConns[uid]===conn)gMetaId=uid;});
          var gMeta=roomState.users.find(function(u){return u.id===gMetaId;});
          if(gMeta&&(gMeta.role==='admin'||gMeta.role==='host')){
            var out=Object.assign({},pkt,{type:pkt.action});
            handleServerPacket(out);
            Object.keys(roomState.peerConns).forEach(function(uid){if(uid!==gMetaId&&roomState.peerConns[uid].open)roomState.peerConns[uid].send(out);});
          }
        }
      });
    });
  }

  function startP2PClient(targetRoomId,nick,pass){
    if(!window.Peer){flash('Сервер комнат недоступен');return;}
    var cleanId=targetRoomId.indexOf('room-')===0?targetRoomId:('room-'+targetRoomId);
    var peer=new window.Peer();roomState.peer=peer;
    peer.on('open',function(){
      var conn=peer.connect('kp-wp-'+cleanId,{reliable:true});roomState.hostConn=conn;
      conn.on('open',function(){conn.send({type:'JOIN_ROOM',roomId:cleanId,name:nick,pass:pass});});
      conn.on('data',function(raw){handleServerPacket(typeof raw==='string'?JSON.parse(raw):raw);});
      conn.on('close',function(){if(roomState.active){leaveRoom();flash('Связь с хостом закрыта');}});
    });
  }

  function initHostServer(nick,pass){
    leaveRoom();roomState.myNick=nick;roomState.roomPass=pass||'';
    if(isStaticGithubHost&&!customApiBase){startP2PHost(nick,pass);return;}
    var wsProto=window.location.protocol===PROTO_HTTPS?'wss:':'ws:',opened=false;
    var wsUrl=customApiBase?(customApiBase.replace(/^http/i,'ws')+'/ws'):(wsProto+SLASH_PAIR+window.location.host+'/ws');
    try{
      var ws=new WebSocket(wsUrl);roomState.ws=ws;
      ws.onopen=function(){opened=true;ws.send(JSON.stringify({type:'CREATE_ROOM',name:nick,pass:pass,time:getCurrentVideoTime(),paused:isVideoPaused(),rate:rate,src:currentSrc,title:customTitle||titleLbl.textContent,vIdx:vIdx,eIdx:eIdx}));};
      ws.onmessage=function(e){try{handleServerPacket(JSON.parse(e.data));}catch(err){}};
      ws.onerror=function(){if(!opened){roomState.ws=null;startP2PHost(nick,pass);}};
      ws.onclose=function(){if(opened&&roomState.active){leaveRoom();flash('Соединение закрыто');}};
    }catch(e){startP2PHost(nick,pass);}
  }

  function initClientConnection(targetRoomId,nick,pass){
    leaveRoom();roomState.myNick=nick;roomState.roomPass=pass||'';
    if(isStaticGithubHost&&!customApiBase){startP2PClient(targetRoomId,nick,pass);return;}
    var wsProto=window.location.protocol===PROTO_HTTPS?'wss:':'ws:',opened=false;
    var wsUrl=customApiBase?(customApiBase.replace(/^http/i,'ws')+'/ws'):(wsProto+SLASH_PAIR+window.location.host+'/ws');
    try{
      var ws=new WebSocket(wsUrl);roomState.ws=ws;
      ws.onopen=function(){opened=true;ws.send(JSON.stringify({type:'JOIN_ROOM',roomId:targetRoomId,name:nick,pass:pass}));};
      ws.onmessage=function(e){try{handleServerPacket(JSON.parse(e.data));}catch(err){}};
      ws.onerror=function(){if(!opened){roomState.ws=null;startP2PClient(targetRoomId,nick,pass);}};
      ws.onclose=function(){if(opened&&roomState.active){leaveRoom();flash('Связь потеряна');}};
    }catch(e){startP2PClient(targetRoomId,nick,pass);}
  }

  function leaveRoom(){
    roomState.active=false;roomState.isHost=false;roomState.isAdmin=false;
    if(roomState.ws){try{roomState.ws.onclose=null;roomState.ws.close();}catch(e){}roomState.ws=null;}
    if(roomState.hostConn){try{roomState.hostConn.close();}catch(e){}roomState.hostConn=null;}
    Object.keys(roomState.peerConns).forEach(function(k){try{roomState.peerConns[k].close();}catch(e){}});
    roomState.peerConns={};
    if(roomState.peer){try{roomState.peer.destroy();}catch(e){}roomState.peer=null;}
    roomState.users=[];updateRoomButtonUI();manageRoomModal.style.display='none';
  }

    if(!targetId||!nick){joinRoomErr.style.display='block';return;}
    joinRoomErr.style.display='none';localStorage.setItem('kp_last_nick',nick);
    joinRoomModal.style.display='none';initClientConnection(targetId,nick,pass);
  };

  copyRoomLinkBtn.onclick=function(){
    var link=getShareUrl(roomState.roomId);
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(link).then(function(){flash('Ссылка скопирована');});
  };

  leaveRoomBtn.onclick=function(){leaveRoom();};

  var savedRate=parseFloat(localStorage.getItem('kodik_rate')||'1');
  setRate(savedRate||1.0,false);

  if(initialRoomId){
    joinRoomIdInput.value=initialRoomId;
    joinNickInput.value=localStorage.getItem('kp_last_nick')||'';
    joinRoomModal.style.display='flex';
  }

  if(currentSrc||initialGk){
    loadContext({src:currentSrc,gk:initialGk,vi:initialVi});
  }else{
    titleLbl.textContent='Открыть ссылку Kodik';
    openSourceModal();
  }
  wakeHud();
})();
</script>
</body>
</html>
